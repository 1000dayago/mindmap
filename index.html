/* ===================== 자동 정렬 ===================== */
function layoutLocal(n, mode, ctx){
  const nodes = N();
  const kids = n.collapsed ? [] : n.children.map(i => nodes[i]);
  const pos = { [n.id]:[0,0] };
  let bb = { l:-n.w/2, r:n.w/2, t:-n.h/2, b:n.h/2 };
  if(!kids.length) return { pos, bb };
  let groups;
  if(mode==='both'){
    if(ctx.sides) groups = [{ dir:'right', kids:kids.filter(k => k.x>=n.x) }, { dir:'left', kids:kids.filter(k => k.x<n.x) }];
    else{ const half = Math.ceil(kids.length/2); groups = [{ dir:'right', kids:kids.slice(0,half) }, { dir:'left', kids:kids.slice(half) }]; }
  }
  else groups = [{ dir:mode, kids }];
  for(const g of groups){
    if(!g.kids.length) continue;
    const L = g.kids.map(c => ({ c, L:layoutLocal(c, c.layout || g.dir, ctx) }));
    if(g.dir==='down'){
      const gapX = ctx.cross*1.6, mainV = Math.round(ctx.main*0.8);
      const total = L.reduce((a,x) => a + (x.L.bb.r - x.L.bb.l), 0) + gapX*(L.length-1);
      let cursor = -total/2;
      for(const x of L){
        const cx = cursor - x.L.bb.l, cy = n.h/2 + mainV - x.L.bb.t;
        for(const id in x.L.pos) pos[id] = [x.L.pos[id][0]+cx, x.L.pos[id][1]+cy];
        bb = { l:Math.min(bb.l,cx+x.L.bb.l), r:Math.max(bb.r,cx+x.L.bb.r), t:Math.min(bb.t,cy+x.L.bb.t), b:Math.max(bb.b,cy+x.L.bb.b) };
        cursor += (x.L.bb.r - x.L.bb.l) + gapX;
      }
    }else{
      const total = L.reduce((a,x) => a + (x.L.bb.b - x.L.bb.t), 0) + ctx.cross*(L.length-1);
      let cursor = -total/2;
      for(const x of L){
        const cy = cursor - x.L.bb.t;
        const cx = g.dir==='right' ? n.w/2 + ctx.main - x.L.bb.l : -(n.w/2 + ctx.main) - x.L.bb.r;
        for(const id in x.L.pos) pos[id] = [x.L.pos[id][0]+cx, x.L.pos[id][1]+cy];
        bb = { l:Math.min(bb.l,cx+x.L.bb.l), r:Math.max(bb.r,cx+x.L.bb.r), t:Math.min(bb.t,cy+x.L.bb.t), b:Math.max(bb.b,cy+x.L.bb.b) };
        cursor += (x.L.bb.b - x.L.bb.t) + ctx.cross;
      }
    }
  }
  return { pos, bb };
}
/* 새 노드를 만들 때 맵 전체를 자동 정렬 (중심 노드는 제자리, 좌/우 방향은 유지) */
function tidyMap(m){
  refitAll(m);
  const nodes = m.nodes, root = nodes[m.rootId], gp = GAPS[S().gap], ctx = { main:gp.main, cross:gp.cross, sides:true };
  let md = root.layout;
  if(!md){
    const ks = root.children.map(i => nodes[i]);
    const r = ks.some(k => k.x>=root.x), l = ks.some(k => k.x<root.x);
    md = (r && l) ? 'both' : isVertical(root) ? 'down' : (ks.length && !r) ? 'left' : 'right';
  }
  const old = {}; for(const i in nodes) old[i] = { x:nodes[i].x, y:nodes[i].y };
  const L = layoutLocal(root, md, ctx);
  for(const id in L.pos){ const q = nodes[id]; q.x = Math.round(root.x + L.pos[id][0]); q.y = Math.round(root.y + L.pos[id][1]); }
  for(const id in L.pos){
    const q = nodes[id];
    if(q.collapsed){ const dx = q.x - old[id].x, dy = q.y - old[id].y; desc(id).forEach(d => { nodes[d].x += dx; nodes[d].y += dy; }); }
  }
}
function applyLayout(id, mode, noUndo){
  const m0 = cur(); if(!m0.nodes[id]) return;
  mutate(m => {
    const n = m.nodes[id], gp = GAPS[S().gap];
    const ctx = { main:gp.main, cross:gp.cross };
    const ds = desc(id);
    if(S().overrideBranches) ds.forEach(c => { m.nodes[c].layout = null; });
    n.layout = mode;
    const old = {}; [id, ...ds].forEach(i => { old[i] = { x:m.nodes[i].x, y:m.nodes[i].y }; });
    const L = layoutLocal(n, mode, ctx);
    const ax = n.x, ay = n.y;
    for(const pid in L.pos){ const q = m.nodes[pid]; q.x = Math.round(ax + L.pos[pid][0]); q.y = Math.round(ay + L.pos[pid][1]); }
    for(const pid in L.pos){
      const q = m.nodes[pid];
      if(q.collapsed){ const dx = q.x - old[pid].x, dy = q.y - old[pid].y; desc(pid).forEach(d => { m.nodes[d].x += dx; m.nodes[d].y += dy; }); }
    }
  }, noUndo ? { noUndo:true } : null);
  if(id===cur().rootId) fitAll();
}

/* ===================== 보기 ===================== */
function bboxOf(list){
  let l=1e9,t=1e9,r=-1e9,b=-1e9;
  for(const n of list){ l=Math.min(l,n.x-n.w/2); r=Math.max(r,n.x+n.w/2); t=Math.min(t,n.y-n.h/2); b=Math.max(b,n.y+n.h/2+(n.shape==='bubble'?11:0)); }
  return { l, t, r, b };
}
let animId = 0;
function animateView(target, animate){
  const from = { x:view.x, y:view.y, k:view.k };
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  cancelAnimationFrame(animId);
  if(animate===false || reduce){ view = target; applyView(); return; }
  const t0 = performance.now(), dur = 240;
  const step = now => {
    const t = clamp((now-t0)/dur, 0, 1), e = 1 - Math.pow(1-t, 3);
    view = { x:from.x+(target.x-from.x)*e, y:from.y+(target.y-from.y)*e, k:from.k+(target.k-from.k)*e };
    applyView();
    if(t<1) animId = requestAnimationFrame(step);
  };
  animId = requestAnimationFrame(step);
}
function fitTo(bb, o){
  o = o||{};
  const rect = svg.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  const pad = isMobile() ? 26 : 56;
  const bw = Math.max(bb.r-bb.l, 1), bh = Math.max(bb.b-bb.t, 1);
  const k = clamp(Math.min((rect.width-pad*2)/bw, (rect.height-pad*2)/bh, o.maxK||BASE_K), .1, 3);
  animateView({ k, x:rect.width/2 - ((bb.l+bb.r)/2)*k, y:rect.height/2 - ((bb.t+bb.b)/2)*k }, o.animate);
}
function pushView(){ viewStack.push({ x:view.x, y:view.y, k:view.k, focusId }); if(viewStack.length>20) viewStack.shift(); }
function fitAll(){ pushView(); focusId = null; render(); fitTo(bboxOf(visibleList())); }
function fitSubtree(id){
  const anyCollapsed = [id, ...desc(id)].some(i => N()[i].collapsed);
  if(anyCollapsed) mutate(m => { [id, ...desc(id)].forEach(i => { m.nodes[i].collapsed = false; }); });
  pushView(); focusId = id; render();
  fitTo(bboxOf([N()[id], ...desc(id).map(i => N()[i])]));
}
function popView(){
  const v = viewStack.pop(); if(!v){ toast('돌아갈 이전 보기가 없어요'); return; }
  focusId = v.focusId; render(); animateView({ x:v.x, y:v.y, k:v.k });
}
function ensureVisible(id){
  const n = N()[id]; if(!n) return;
  const rect = svg.getBoundingClientRect();
  const sx = n.x*view.k + view.x, sy = n.y*view.k + view.y, mg = 60;
  if(sx<mg || sy<mg || sx>rect.width-mg || sy>rect.height-mg*2){
    animateView({ k:view.k, x:rect.width/2 - n.x*view.k, y:rect.height/2.4 - n.y*view.k });
  }
}
function zoomAt(cx, cy, f){
  const k2 = clamp(view.k*f, .1, 3), wx = (cx-view.x)/view.k, wy = (cy-view.y)/view.k;
  view = { k:k2, x:cx - wx*k2, y:cy - wy*k2 }; applyView();
}
function zoomCenter(f){ const r = svg.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, f); }
$('#zin').addEventListener('click', () => zoomCenter(1.25));
$('#zout').addEventListener('click', () => zoomCenter(0.8));
$('#zlabel').addEventListener('click', () => { const r = svg.getBoundingClientRect(); const cx=(r.width/2-view.x)/view.k, cy=(r.height/2-view.y)/view.k; view = { k:BASE_K, x:r.width/2-cx*BASE_K, y:r.height/2-cy*BASE_K }; applyView(); });
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0015)));
}, { passive:false });

/* ===================== 포인터(드래그/이동/핀치) ===================== */
const pts = new Map();
let gest = null, pinch = null, lpTimer = null, lastTap = { id:null, t:0 };
let ctlGuardUntil = 0; // 노드 선택 직후 ＋/− 실수 탭 방지 (고스트 클릭)

function startLongPress(){
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    if(gest && !gest.moved && gest.kind==='node' && gest.ptype!=='mouse'){
      gest.lp = true; sel = gest.id; render();
      if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
      openNodeMenu(gest.id);
    }
  }, 650);
}
const cancelLongPress = () => clearTimeout(lpTimer);

svg.addEventListener('pointerdown', e => {
  if(e.button===2) return;
  try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(pts.size===2){
    cancelLongPress(); gest = null;
    const [a,b] = [...pts.values()];
    const r = svg.getBoundingClientRect();
    pinch = { d:Math.hypot(a.x-b.x,a.y-b.y)||1, mx:(a.x+b.x)/2-r.left, my:(a.y+b.y)/2-r.top, v:{ x:view.x, y:view.y, k:view.k } };
    return;
  }
  if(pts.size>2) return;
  const t = e.target;
  const lh = t.closest('[data-lh]'), bd = t.closest('[data-badge]'), tg = t.closest('[data-toggle]'), el = t.closest('[data-elabel]'),
        nd = t.closest('[data-nid]'), lk = t.closest('[data-lid]'), gp = t.closest('[data-gid]');
  gest = { sx:e.clientX, sy:e.clientY, lx:e.clientX, ly:e.clientY, moved:false, kind:'bg', id:null, ptype:e.pointerType, shift:e.shiftKey, drag:false, lp:false };
  if(lh && !mode){ gest.kind = 'lh'; gest.id = lh.dataset.lh; }
  else if(bd && !mode){ gest.kind = 'badge'; gest.id = bd.dataset.badge; gest.bt = bd.dataset.bt; }
  else if(tg && !mode){ gest.kind = 'toggle'; gest.id = tg.dataset.toggle; }
  else if(el && !mode){ gest.kind = 'elabel'; gest.id = el.dataset.elabel; }
  else if(nd){
    gest.kind = 'node'; gest.id = nd.dataset.nid;
    gest.drag = !(S().pen && e.pointerType==='touch') && !mode && !S().lock && !(N()[gest.id] && N()[gest.id].pin);
    if(!mode) startLongPress();
  }
  else if(lk && !mode){ gest.kind = 'link'; gest.id = lk.dataset.lid; }
  else if(gp && !mode){ gest.kind = 'group'; gest.id = gp.dataset.gid; }
});
svg.addEventListener('pointermove', e => {
  if(!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(pinch){
    if(pts.size<2) return;
    const [a,b] = [...pts.values()], r = svg.getBoundingClientRect();
    const d = Math.hypot(a.x-b.x,a.y-b.y)||1, mx = (a.x+b.x)/2-r.left, my = (a.y+b.y)/2-r.top;
    const k = clamp(pinch.v.k*d/pinch.d, .1, 3);
    const wx = (pinch.mx-pinch.v.x)/pinch.v.k, wy = (pinch.my-pinch.v.y)/pinch.v.k;
    view = { k, x:mx - wx*k, y:my - wy*k }; applyView();
    return;
  }
  if(!gest) return;
  const thr = gest.ptype==='mouse' ? 4 : 8;
  if(!gest.moved){
    if(Math.hypot(e.clientX-gest.sx, e.clientY-gest.sy) < thr) return;
    gest.moved = true; cancelLongPress();
    if(gest.kind==='node' && gest.drag) beginDrag(e);
    else if(gest.kind==='group') beginGroupDrag(e);
    else if(gest.kind==='lh') beginLH();
    placeCtl();
  }
  if(gest.kind==='node' && gest.drag){ doDrag(e); }
  else if(gest.kind==='group' && gest.orig){ doGroupDrag(e); }
  else if(gest.kind==='lh'){ doLH(e); }
  else{ view.x += e.clientX-gest.lx; view.y += e.clientY-gest.ly; applyView(); }
  gest.lx = e.clientX; gest.ly = e.clientY;
});
function endPointer(e, cancelled){
  pts.delete(e.pointerId); cancelLongPress(); guideHide();
  if(pinch){ if(pts.size<2) pinch = null; gest = null; return; }
  const g = gest; gest = null; nbTrashShow(false); if(!g) return;
  if(g.lp) return;
  // 미세한 움직임은 탭으로 취급 (더블탭 편집이 깨지지 않게)
  const moveDist = Math.hypot((e.clientX||g.lx)-g.sx, (e.clientY||g.ly)-g.sy);
  const tapSlop = (g.ptype==='mouse') ? 10 : 18;
  const wasTap = !g.moved || moveDist < tapSlop;
  if(g.moved && !wasTap){
    if((g.kind==='group' || g.kind==='lh') && g.before){
      if(snap(cur())!==g.before){ pushUndo(g.before); saveSoon(); }
      render(); return;
    }
    if(g.kind==='node' && g.drag && g.before){
      const m = cur();
      let msg = '';
      if(!cancelled && nbTrashHot && g.id!==m.rootId && g.orig){
        nbTrashHot = false; dropId = null;
        for(const o of g.orig){ if(m.nodes[o.id]){ m.nodes[o.id].x = o.x; m.nodes[o.id].y = o.y; } }
        deleteNode(g.id); return;
      }
      if(!cancelled && g.drop && m.nodes[g.drop] && m.nodes[g.id]){
        reparentInPlace(g.id, g.drop, g.single); refitAll(m);
        msg = '“'+short(m.nodes[g.drop].text)+'” 하위로 연결했어요';
      }
      dropId = null;
      if(!cancelled && m.nodes[g.id]){
        const par2 = angleParentOf(m, m.nodes[g.id]);
        const ang = dropMode()==='angle' && par2 && !msg;
        const moved = settleNoOverlap(m, g.orig.map(o => o.id), { ray: ang ? { x:m.nodes[g.id].x-par2.x, y:m.nodes[g.id].y-par2.y } : null, parentId: par2 ? par2.id : null });
        if(moved && !msg) msg = '겹치지 않게 옆으로 옮겼어요';
      }
      ctlGuardUntil = performance.now() + 500;
      if(snap(m)!==g.before){ pushUndo(g.before); saveSoon(); }
      render();
      if(msg){ cutId = null; render(); toast(msg); }
    }
    return;
  }
  // 드래그로 잠깐 들어갔다가 탭으로 판정된 경우 위치 되돌리기
  if(g.moved && wasTap && g.kind==='node' && g.drag && g.before && g.orig){
    const m = cur();
    for(const o of g.orig){ if(m.nodes[o.id]){ m.nodes[o.id].x = o.x; m.nodes[o.id].y = o.y; } }
    dropId = null;
  }
  if(cancelled) return;
  if(mode){ if(g.kind==='node') modeTap(g.id); return; }
  if(g.kind==='toggle') toggleCollapse(g.id);
  else if(g.kind==='elabel'){ sel = N()[g.id] ? g.id : sel; render(); editLabel(g.id); }
  else if(g.kind==='badge'){ ctlGuardUntil = performance.now() + 600; sel = N()[g.id] ? g.id : sel; selLink = null; render(); badgeAct(g.id, g.bt); }
  else if(g.kind==='link'){ sel = null; selLink = g.id; render(); }
  else if(g.kind==='group'){ const gg = cur().groups[g.id]; if(gg){ if(gg.collapsed) toggleGroupCollapse(g.id); else openGroupSheet(g.id); } }
  else if(g.kind==='lh'){ /* 가운데 점만 탭: 변화 없음 */ }
  else if(g.kind==='node'){
    const now = performance.now();
    // 한 번 = 선택, 두 번(600ms 이내) = 기존 노드 편집
    if(lastTap.id===g.id && (now-lastTap.t)<600){
      lastTap = { id:null, t:0 };
      ctlGuardUntil = now + 500;
      sel = g.id; render();
      openEdit(g.id);
    }else{
      lastTap = { id:g.id, t:now };
      ctlGuardUntil = now + 500;
      select(g.id);
    }
  }else{ if(sel || selLink){ sel = null; selLink = null; render(); } }
}
svg.addEventListener('pointerup', e => endPointer(e,false));
svg.addEventListener('pointercancel', e => endPointer(e,true));

// 캔버스 빈 곳을 더블클릭하면 트리와 연결되지 않은 독립 노드를 만든다.
function addFloatingNodeAt(clientX, clientY){
  if($('#pageMap').classList.contains('hidden') || mode || !sheetWrap.classList.contains('hidden')) return;
  const rect = svg.getBoundingClientRect();
  const x = Math.round((clientX - rect.left - view.x) / view.k);
  const y = Math.round((clientY - rect.top - view.y) / view.k);
  let id = null;
  if(lockedMsg()) return;
  mutate(m => {
    const n = mkNode({ parent:null, text:'', x, y, shape:'rounded' });
    fitNode(n);
    m.nodes[n.id] = n;
    id = n.id;
    settleNoOverlap(m, [n.id]);
  });
  sel = id; selLink = null; render();
  toast('독립 노드를 만들었어요. 내용을 입력하세요.');
  openEdit(id, { isNew:true });
}
svg.addEventListener('dblclick', e => {
  if(e.button !== 0) return;
  const t = e.target;
  const nd = t.closest && t.closest('[data-nid]');
  if(nd){
    e.preventDefault();
    e.stopPropagation();
    const id = nd.dataset.nid;
    if(!N()[id]) return;
    lastTap = { id:null, t:0 };
    ctlGuardUntil = performance.now() + 500;
    sel = id; selLink = null; render();
    openEdit(id); // 더블클릭 → 노드 편집
    return;
  }
  // 연결선·그룹 등 위에서는 빈 화면 더블클릭 동작 안 함
  if(t.closest && t.closest('[data-lid],[data-gid],[data-badge],[data-toggle],[data-elabel],[data-lh]')) return;
  e.preventDefault();
  addFloatingNodeAt(e.clientX, e.clientY);
});
svg.addEventListener('contextmenu', e => {
  e.preventDefault();
  const nd = e.target.closest && e.target.closest('[data-nid]');
  if(nd){ sel = nd.dataset.nid; render(); openNodeMenu(sel); }
});

function beginDrag(e){
  const m = cur(), n = m.nodes[gest.id];
  gest.before = snap(m);
  sel = gest.id;
  cutId = (n.parent && m.nodes[n.parent] && gest.id!==m.rootId) ? gest.id : null;
  nbTrashHot = false;
  const single = singleMove || gest.shift || e.shiftKey;
  gest.single = single;
  const ids = single ? [gest.id] : [gest.id, ...desc(gest.id)];
  gest.orig = ids.map(i => ({ id:i, x:m.nodes[i].x, y:m.nodes[i].y }));
  gest.ox = n.x; gest.oy = n.y;
  gest.sx0 = e.clientX; gest.sy0 = e.clientY;
}
function doDrag(e){
  const m = cur();
  let dx = (e.clientX-gest.sx0)/view.k, dy = (e.clientY-gest.sy0)/view.k;
  const dn = m.nodes[gest.id];
  const par = angleParentOf(m, dn);
  const useAngle = dropMode()==='angle' && !!par;
  if(S().snap && !useAngle){ dx = Math.round((gest.ox+dx)/20)*20 - gest.ox; dy = Math.round((gest.oy+dy)/20)*20 - gest.oy; }
  const rx = gest.ox + dx, ry = gest.oy + dy;      // 손가락이 가리키는 위치
  gest.drop = null;
  if(gest.id!==m.rootId){
    const forbid = new Set([gest.id, ...desc(gest.id)]);
    const mg = clamp(18/view.k, 10, 60);
    let best = null, bd = 1e9;
    for(const c of visibleList()){
      if(forbid.has(c.id)) continue;
      if(Math.abs(rx-c.x) <= c.w/2+mg && Math.abs(ry-c.y) <= c.h/2+mg){
        const d = Math.hypot(rx-c.x, ry-c.y); if(d<bd){ bd = d; best = c.id; }
      }
    }
    if(best && best!==dn.parent) gest.drop = best;
  }
  if(useAngle && !gest.drop){ const sp = snapAngleAround(par, rx, ry); dx = sp.x - gest.ox; dy = sp.y - gest.oy; }
  for(const o of gest.orig){ const q = m.nodes[o.id]; q.x = Math.round(o.x+dx); q.y = Math.round(o.y+dy); }
  if(useAngle && !gest.drop) guideShow(par, dn.x, dn.y); else guideHide();
  dropId = gest.drop;
  nbTrashUpdate(e);
  renderSoon();
}

/* ===================== 팝업: 노드 메뉴 / 모양 / 색상 / 정렬 / 보기 ===================== */

function openShapePicker(node, onPick){

}
function openColorSheet(id){
  const n = N()[id]; if(!n) return;
  let scope = 'tree';
  openSheet('색상', b => {

function importFile(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const o = JSON.parse(rd.result);
      const arr = Array.isArray(o.maps) ? o.maps : (o.nodes ? [o] : []);
      let added = 0, lastId = null; const idMap = {};
      arr.forEach(raw => {
        const m = normalizeMap(raw, false); if(!m) return;
        if(raw && raw.id) idMap[raw.id] = m.id;
        if(data.order.some(id => data.maps[id].name===m.name)) m.name += ' (가져옴)';
        data.maps[m.id] = m; data.order.push(m.id); refitAll(m); added++; lastId = m.id;
      });
      (Array.isArray(o.events) ? o.events : []).forEach(r => {
        const ev = normEvent(r); if(!ev || data.events[ev.id]) return;
        if(ev.link){ const nm = idMap[ev.link.mapId]; if(nm) ev.link.mapId = nm; else ev.link = null; }
        data.events[ev.id] = ev;
      });
      if(!added){ toast('불러올 수 있는 맵이 없어요'); return; }
      saveNow(); toast(added+'개 맵을 불러왔어요'); switchMap(lastId);
    }catch(e){ toast('JSON 파일을 읽지 못했어요'); }
  };
  rd.readAsText(file);
}

function exportPNG(){
  const vis = visibleList(), bb = bboxOf(vis), pad = 40;
  const x = bb.l-pad, y = bb.t-pad, w = bb.r-bb.l+pad*2, hh = bb.b-bb.t+pad*2;
  const sc = Math.min(2, 6000/Math.max(w,hh));
  const body = buildWorld({ exporting:true, dark:false });
  const str = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(w*sc)}" height="${Math.round(hh*sc)}" viewBox="${x} ${y} ${w} ${hh}"><defs>${SHADOW_DEFS}</defs><rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="#ffffff"/>${body}</svg>`;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = Math.round(w*sc); c.height = Math.round(hh*sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(bl => {
      if(!bl){ toast('PNG 생성에 실패했어요'); return; }
      const a = h('a',{ href:URL.createObjectURL(bl), download:fname(cur().name)+'_'+stamp()+'.png' });
      document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    }, 'image/png');
  };
  img.onerror = () => toast('PNG 생성에 실패했어요');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
}

/* ===================== 노드 구조 편집(상위/하위/연결 이동) ===================== */
function reparentInPlace(id, newPid, single){
  const m = cur(), n = m.nodes[id], np = m.nodes[newPid];
  if(!n || !np || id===newPid || id===m.rootId) return false;
  // 자기 자신 또는 자기 하위 노드 아래로 이동하는 순환 연결은 차단한다.
  if(desc(id).includes(newPid)) return false;
  const op = n.parent ? m.nodes[n.parent] : null;
  // 배경 더블클릭으로 만든 독립 노드는 parent가 없으므로,
  // 기존 부모가 있을 때만 이전 부모의 children에서 제거한다.
  if(op) op.children = op.children.filter(c => c!==id);
  if(op && op.shape==='diamond' && n.kind){ n.kind = ''; n.label = ''; }
  n.parent = newPid; np.collapsed = false;
  const ox = n.x, oy = n.y;
  placeNew(np, n);
  const dx = n.x-ox, dy = n.y-oy;
  if(!single) desc(id).forEach(i => { m.nodes[i].x += dx; m.nodes[i].y += dy; });
  if(!np.children.includes(id)) np.children.push(id);
  return true;
}
function addParentAbove(id){
  const n0 = N()[id];
  if(!n0 || !n0.parent){ toast('중심 노드 위에는 노드를 만들 수 없어요'); return; }
  if(lockedMsg()) return;
  let newId;
  mutate(m => {
    const n = m.nodes[id], p = m.nodes[n.parent], gp = GAPS[S().gap];
    const c = mkNode({ parent:p.id, children:[id], kind:n.kind, label:n.label });
    n.kind = ''; n.label = '';
    fitNode(c);
    const idx = p.children.indexOf(id); p.children[idx] = c.id; n.parent = c.id;
    let dx = 0, dy = 0;

function removeParent(id){

  if(lockedMsg()) return;
  const pid = n0.parent, p0 = m0.nodes[pid];
  if(!p0.parent){ toast('중심 노드는 삭제할 수 없어요'); return; }
  if(false && !confirm('“'+short(p0.text)+'” 노드를 삭제하면 같은 레벨의 노드들도 함께 한 단계 위로 올라가요. 계속할까요?')) return;
  mutate(m => {
    const p = m.nodes[pid], g = m.nodes[p.parent];
    const idx = g.children.indexOf(pid);
    g.children.splice(idx, 1, ...p.children);
    p.children.forEach(c => { m.nodes[c].parent = g.id; });
    if(p.children.length===1 && p.kind){ const c = m.nodes[p.children[0]]; if(!c.kind){ c.kind = p.kind; c.label = p.label; } }

function nbPlace(n){
  const stage = $('#stage'), SW = stage.clientWidth, SH = stage.clientHeight;
  const k = view.k, cx = n.x*k+view.x, cy = n.y*k+view.y, hw = n.w/2*k, hh = n.h/2*k;
  const mob = isMobile(), rid = cur().rootId;
  const vert = (typeof isVertical==='function') && isVertical(n);
  const dir = n.id===rid ? 1 : dirOf(n);
  // ＋ 점: 하위가 생길 쪽 가장자리
  const off = mob ? 20 : 16;   // 노드를 잡는 손가락이 ＋ 에 닿지 않도록 충분히 띄운다
  const hasBadge = !!((n.memo||'').trim() || (n.checks && n.checks.length) || (n.urls && n.urls.length) || n.table || n.due || n.val!=null || (aggNow && aggNow[n.id]) || (progNow && progNow[n.id] && progNow[n.id].t));
  let hx, hy;
  // 배지(메모·체크·링크·표)가 노드 아래쪽에 있으면 ＋ 가 배지와 멀어지도록 위로(세로 배치는 더 아래로) 비킨다
  if(vert){ hx = cx; hy = cy+hh+off+(hasBadge ? 16 : 0); } else { hx = cx + (dir>=0?1:-1)*(hw+off); hy = cy - (hasBadge ? Math.min(14, hh*0.7) : 0); }
  nbPlus.style.left = hx+'px'; nbPlus.style.top = hy+'px';
  // 막대: ＋ 점 반대편(보통 아래)
  const gap = mob ? 14 : 9;
  const bw = nbBar.offsetWidth || 150, bh = nbBar.offsetHeight || 30;
  // 노드 아래에 걸친 배지(메모·체크·링크·표)가 있으면 막대는 위쪽에 띄워 서로 안 겹치게 한다
  let below = !vert && !hasBadge;
  if(!below && !vert && hasBadge && cy-hh-gap-bh < 4) below = true;   // 위에 자리가 없으면 아래로, 배지 높이만큼 더 띄운다
  const gapB = (below && hasBadge) ? gap + 16 : gap;
  if(below && cy+hh+gapB+bh > SH-4 && cy-hh-gap-bh > 4) below = false;
  const bl = clamp(cx - bw/2, 6, Math.max(6, SW-bw-6));
  const bt = below ? cy+hh+gapB : cy-hh-gap-bh;
  nbBar.style.left = bl+'px'; nbBar.style.top = bt+'px';
  // 하위 메뉴
  if(!nb.open){ nbFly.classList.add('hidden'); nbFly.classList.remove('show'); return; }
  const wasHidden = nbFly.classList.contains('hidden');
  nbFly.classList.remove('hidden');
  const fw = nbFly.offsetWidth || 160, fh = nbFly.offsetHeight || 60;
  let fBelow = below;
  if(fBelow && bt+bh+6+fh > SH-4 && bt-6-fh > 4) fBelow = false;
  if(!fBelow && bt-6-fh < 4 && bt+bh+6+fh <= SH-4) fBelow = true;
  const fl = clamp(bl + bw/2 - fw/2, 6, Math.max(6, SW-fw-6));
  nbFly.style.left = fl+'px'; nbFly.style.top = (fBelow ? bt+bh+6 : bt-6-fh)+'px';
  nbFly.classList.toggle('up', !fBelow);
  if(wasHidden){ nbFly.classList.remove('show'); void nbFly.offsetWidth; }
  nbFly.classList.add('show');
}

/* ---------- 목차(들여쓰기 목록) → 탭 구분으로 바꿔 기존 붙여넣기 엔진에 연결 ---------- */
function outlineToTabs(text){
  if(/\t/.test(text)) return text;
  const lines = String(text).replace(/\r/g,'').split('\n');
  const ind = lines.map(l => { const mm = /^( +)/.exec(l); return mm ? mm[1].length : 0; });
  const hasBullet = lines.some(l => /^\s*[-*•·]\s+/.test(l));
  if(!ind.some(x => x>0) && !hasBullet) return text;
  const pos = ind.filter(x => x>0), u = pos.length ? Math.min(...pos) : 2;
  return lines.map((l, i) => '\t'.repeat(Math.round(ind[i]/u)) + l.trim().replace(/^[-*•·]\s+/, '')).join('\n');
}

/* ===================== 손으로 놓을 때: 45° 맞춤 / 자유 배치 + 겹침 방지 ===================== */
const dropMode = () => (S().dropMode === 'angle' ? 'angle' : 'free');
const keepApart = () => S().noOverlap !== false;
const ANG_STEP = Math.PI / 4;

// 부모를 중심으로 8방향(45°)에 맞춘 위치. 거리는 그대로 둔다.
function snapAngleAround(p, x, y){
  const dx = x - p.x, dy = y - p.y, d = Math.hypot(dx, dy);
  if(d < 1) return { x, y };
  const a = Math.round(Math.atan2(dy, dx) / ANG_STEP) * ANG_STEP;
  return { x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d };
}
function angleParentOf(m, n){
  if(!n || n.id === m.rootId || !n.parent) return null;
  return m.nodes[n.parent] || null;
}

// 화면에 실제로 그려지는 노드 (접힌 가지의 안쪽은 제외)
function shownNodes(m){
  const out = [], seen = new Set();
  const walk = id => {
    const n = m.nodes[id]; if(!n || seen.has(id)) return;
    seen.add(id); out.push(n);
    if(!n.collapsed) n.children.forEach(walk);
  };
  walk(m.rootId);
  for(const id in m.nodes){ const n = m.nodes[id]; if(!seen.has(id) && !n.parent) walk(id); }
  return out;
}
const rectOfNode = (n, ex, ey) => ({
  l: n.x + ex - n.w / 2, r: n.x + ex + n.w / 2,
  t: n.y + ey - n.h / 2, b: n.y + ey + n.h / 2 + (n.shape === 'bubble' ? 11 : 0)
});
const OV_GAP = 10;
function hitsAny(grp, others, ex, ey){
  for(const g of grp){
    const a = rectOfNode(g, ex, ey);
    for(const o of others){
      if(a.l < o.r + OV_GAP && a.r + OV_GAP > o.l && a.t < o.b + OV_GAP && a.b + OV_GAP > o.t) return true;
    }
  }
  return false;
}

// 옮겨 놓은 노드들(ids)이 다른 노드와 겹치면, 가장 가까운 빈자리로 함께 밀어낸다.
// 반환: 실제로 옮겼으면 true
function settleNoOverlap(m, ids, o){
  o = o || {};
  if(!keepApart()) return false;
  const set = new Set(ids);
  const shown = shownNodes(m);
  const grp = shown.filter(n => set.has(n.id));
  const PAD = 16;   // 부모와는 연결선·표시가 보이도록 조금 더 띄운다
  const others = shown.filter(n => !set.has(n.id)).map(n => {
    const r = rectOfNode(n, 0, 0);
    if(o.parentId && n.id === o.parentId){ r.l -= PAD; r.r += PAD; r.t -= PAD; r.b += PAD; }
    return r;
  });
  if(!grp.length || !others.length) return false;
  if(!hitsAny(grp, others, 0, 0)) return false;
  let found = null;
  // 45° 모드: 부모에서 뻗은 방향 그대로 바깥으로 밀어낸다
  if(o.ray){
    const L = Math.hypot(o.ray.x, o.ray.y) || 1, ux = o.ray.x / L, uy = o.ray.y / L;
    for(let t = 8; t <= 1600 && !found; t += 8){
      if(!hitsAny(grp, others, ux * t, uy * t)) found = { x: ux * t, y: uy * t };
    }
  }
  // 자유 모드: 놓은 자리에서 가장 가까운 빈자리 (나선형 탐색)
  for(let r = 12; r <= 900 && !found; r += 12){
    const cnt = Math.max(16, Math.min(72, Math.ceil(2 * Math.PI * r / 20)));
    const a0 = o.ray ? Math.atan2(o.ray.y, o.ray.x) : 0;
    for(let k = 0; k < cnt && !found; k++){
      const a = a0 + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (2 * Math.PI / cnt);
      const ex = Math.cos(a) * r, ey = Math.sin(a) * r;
      if(!hitsAny(grp, others, ex, ey)) found = { x: ex, y: ey };
    }
  }
  if(!found) return false;
  ids.forEach(id => { const q = m.nodes[id]; if(q){ q.x = Math.round(q.x + found.x); q.y = Math.round(q.y + found.y); } });
  return true;
}

// 새 노드를 손으로 놓은 자리(wx, wy)에 맞춰 최종 위치를 정한다. (＋ 점 끌어서 만들기)
function settleNewNode(m, nid){
  const n = m.nodes[nid]; if(!n) return;
  fitNode(n);
  const p = angleParentOf(m, n);
  if(p && dropMode() === 'angle'){
    const s = snapAngleAround(p, n.x, n.y); n.x = Math.round(s.x); n.y = Math.round(s.y);
  }
  settleNoOverlap(m, [nid], { ray: p && dropMode() === 'angle' ? { x: n.x - p.x, y: n.y - p.y } : null, parentId: p ? p.id : null });
}

/* 끄는 동안 보이는 방향 안내선 (45° 모드) */
const dragGuide = (() => {

  sv.id = 'dragGuide'; sv.classList.add('hidden');

function guideShow(p, nx, ny){
  const k = view.k, ox = p.x * k + view.x, oy = p.y * k + view.y;
  const nxs = nx * k + view.x, nys = ny * k + view.y;
  const len = Math.max(120, Math.hypot(nxs - ox, nys - oy) + 80);
  const act = Math.round(Math.atan2(nys - oy, nxs - ox) / ANG_STEP);
  let s = '';
  for(let i = 0; i < 8; i++){
    const a = i * ANG_STEP, on = ((i - act) % 8 + 8) % 8 === 0;
    s += '<line x1="'+ox.toFixed(1)+'" y1="'+oy.toFixed(1)+'" x2="'+(ox + Math.cos(a) * len).toFixed(1)+'" y2="'+(oy + Math.sin(a) * len).toFixed(1)+'" class="'+(on ? 'on' : '')+'"/>';
  }
  dragGuide.innerHTML = s; dragGuide.classList.remove('hidden');
}

function groupOf(nid){ const gs = cur().groups; for(const gid in gs){ if(gs[gid].members.includes(nid)) return gs[gid]; } return null; }
function removeFromGroups(m, nid){ for(const gid in m.groups){ m.groups[gid].members = m.groups[gid].members.filter(i => i!==nid); } }
function groupHidden(m){

  for(const gid in m.groups){
    const g = m.groups[gid];
    if(g.collapsed) g.members.forEach(i => { if(m.nodes[i]){ s.add(i); desc(i).forEach(d => s.add(d)); } });
  }

}
function createGroup(ids, name){
  mutate(m => {
    ids = ids.filter(i => m.nodes[i]);
    ids.forEach(i => removeFromGroups(m, i));
    const gid = uid();
    m.groups[gid] = { id:gid, name, color:PALETTE[Object.keys(m.groups).length % PALETTE.length], members:ids, collapsed:false, x:0, y:0 };
  });

function startGroupMode(gid, pre){

function finishGroupMode(){

  const ids = [...md.set];
  if(md.gid){
    setMode(null);
    mutate(m => { const g = m.groups[md.gid]; if(!g) return; ids.forEach(i => { removeFromGroups(m, i); }); g.members.push(...ids.filter(i => m.nodes[i])); });

/* ===================== 연관선(점선) ===================== */
function visAnc(id, vis){ const nodes = N(); let n = nodes[id]; while(n && !vis.has(n.id)) n = n.parent ? nodes[n.parent] : null; return n; }
function edgePt(n, tx, ty){
  let dx = tx-n.x, dy = ty-n.y; const L = Math.hypot(dx,dy) || 1; dx /= L; dy /= L;
  const a = n.w/2+3, b = n.h/2+3; let t;
  if(n.shape==='ellipse') t = 1/Math.sqrt((dx/a)*(dx/a)+(dy/b)*(dy/b));
  else if(n.shape==='diamond') t = 1/(Math.abs(dx)/a+Math.abs(dy)/b);
  else t = Math.min(Math.abs(dx)>1e-6 ? a/Math.abs(dx) : 1e9, Math.abs(dy)>1e-6 ? b/Math.abs(dy) : 1e9);
  return { x:n.x+dx*t, y:n.y+dy*t };
}
function qpt(p0, c, p2, t){ const u = 1-t; return { x:u*u*p0.x+2*u*t*c.x+t*t*p2.x, y:u*u*p0.y+2*u*t*c.y+t*t*p2.y }; }
function linkGeom(l, visSet, visList){
  const A = visAnc(l.from, visSet), B = visAnc(l.to, visSet);
  if(!A || !B || A===B) return null;
  const mid = { x:(A.x+B.x)/2, y:(A.y+B.y)/2 };
  const build = c => ({ p0:edgePt(A,c.x,c.y), p2:edgePt(B,c.x,c.y), c });
  let g;
  if(l.off){ g = build({ x:mid.x+l.off.x, y:mid.y+l.off.y }); }
  else{
    const dx = B.x-A.x, dy = B.y-A.y, L = Math.hypot(dx,dy) || 1, ux = -dy/L, uy = dx/L;
    const x0 = Math.min(A.x,B.x)-420, x1 = Math.max(A.x,B.x)+420, y0 = Math.min(A.y,B.y)-420, y1 = Math.max(A.y,B.y)+420;
    const obs = visList.filter(o => o!==A && o!==B && o.x>x0 && o.x<x1 && o.y>y0 && o.y<y1);
    let best = null, bc = 1e9;
    for(const s of [40,-40,90,-90,150,-150,230,-230,330,-330,0]){
      const cand = build({ x:mid.x+ux*s, y:mid.y+uy*s });
      let hits = 0;
      for(let i=1;i<=22;i++){
        const q = qpt(cand.p0, cand.c, cand.p2, i/23);
        for(const o of obs){ if(Math.abs(q.x-o.x) < o.w/2+7 && Math.abs(q.y-o.y) < o.h/2+7){ hits++; break; } }
      }
      if(hits<bc){ bc = hits; best = cand; if(!hits) break; }
    }
    g = best;
  }
  g.A = A; g.B = B; g.mid = qpt(g.p0, g.c, g.p2, .5); g.baseMid = mid;
  return g;
}
function arrowPoly(tip, from, col){
  let dx = tip.x-from.x, dy = tip.y-from.y; const L = Math.hypot(dx,dy) || 1; dx /= L; dy /= L;
  const bx = tip.x-dx*10, by = tip.y-dy*10, px = -dy*5, py = dx*5;
  return `<polygon points="${tip.x},${tip.y} ${bx+px},${by+py} ${bx-px},${by-py}" fill="${col}" stroke="${col}" stroke-width="1" stroke-linejoin="round"/>`;
}
function linksSvg(m, visSet, visList, dark, focusSet, opt){
  let s = '', handles = '';
  for(const lid in m.links){
    const l = m.links[lid];
    const g = linkGeom(l, visSet, visList); if(!g) continue;
    linkMid.set(lid, g.mid);
    const col = l.color || (dark ? '#b49cff' : '#8b5cf6');
    const isSel = !opt.exporting && selLink===lid;
    const dim = focusSet && !(focusSet.has(g.A.id) && focusSet.has(g.B.id));
    const d = `M${g.p0.x},${g.p0.y} Q${g.c.x},${g.c.y} ${g.p2.x},${g.p2.y}`;
    s += `<g opacity="${dim?0.15:1}">`;
    s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="${isSel?3.4:2.6}" stroke-dasharray="0.1 7" stroke-linecap="round"/>`;
    if(l.arrow==='end' || l.arrow==='both') s += arrowPoly(g.p2, g.c, col);
    if(l.arrow==='both') s += arrowPoly(g.p0, g.c, col);
    if(l.label){
      const tw = textW(l.label,11,true)+16;
      s += `<g ${opt.exporting?'':`data-lid="${lid}"`} transform="translate(${g.mid.x},${g.mid.y})" style="cursor:pointer"><rect x="${-tw/2}" y="-10" width="${tw}" height="20" rx="10" fill="${dark?'#171b2a':'#ffffff'}" stroke="${col}" stroke-width="1.4"/>`+
           `<text font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="${col}" font-family='${FONT}' style="pointer-events:none">${esc(l.label)}</text></g>`;
    }
    if(!opt.exporting) s += `<path data-lid="${lid}" d="${d}" fill="none" stroke="transparent" stroke-width="20" style="pointer-events:stroke;cursor:pointer"/>`;
    s += `</g>`;
    if(isSel) handles += `<circle data-lh="${lid}" cx="${g.mid.x}" cy="${g.mid.y}" r="8" fill="${dark?'#171b2a':'#fff'}" stroke="${col}" stroke-width="3" style="cursor:grab"/>`;
  }
  return { s, handles };
}

  }else{
    const pw = pr.width || 390;
    const lim = Math.max(120, r.width - pw - 50);
    if(sx>lim) nx += lim-sx;

(function(){
  const grip = $('#npGrip'); let d = null, lastTap = 0;
  grip.addEventListener('pointerdown', e => {
    const r = npanel.getBoundingClientRect(), pr = $('#stage').getBoundingClientRect();
    d = { x:e.clientX, y:e.clientY, w:r.width, h:r.height, sh:pr.height, sw:pr.width, moved:false };
    try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });
  grip.addEventListener('pointermove', e => {
    if(!d) return;
    if(Math.abs(e.clientX-d.x) + Math.abs(e.clientY-d.y) > 4) d.moved = true;
    if(!d.moved) return;
    npanel.classList.remove('max'); $('#npMax').classList.remove('on');
    if(isMobile()){
      const nh = Math.round(clamp(d.h + (d.y - e.clientY), 170, d.sh - 8));
      npPref.h = nh; npanel.style.setProperty('--np-h', nh+'px');
    }else{
      const nw = Math.round(clamp(d.w + (d.x - e.clientX), 300, d.sw - 40));
      npPref.w = nw; npanel.style.setProperty('--np-w', nw+'px');
    }
  });
  const end = e => {
    if(!d) return; const dd = d; d = null;
    try{ grip.releasePointerCapture(e.pointerId); }catch(_){}
    if(dd.moved){ npSavePref(); setTimeout(() => { fitNpanelToViewport(); if(pn) revealForPanel(pn.id); }, 30); }

// 저장 형식: n.memo = 글자만(검색·복사·옛 버전용), n.memoH = 서식 있는 HTML(정리된 것만 허용)
function memoSan(html){
  const doc = new DOMParser().parseFromString('<!doctype html><body>'+String(html||''), 'text/html');
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/ /g,'&nbsp;');
  const colorOk = c => /^(#[0-9a-f]{3,8}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*[\d.]+\s*)?\))$/i.test(String(c||'').trim());
  const isDef = c => /^(rgb\(\s*1\s*,\s*1\s*,\s*1\s*\)|#010101|#001)$/i.test(String(c||'').trim());
  const FSZ = { 'x-small':1, 'small':1, 'large':1, 'x-large':1, 'xx-large':1, 'xxx-large':1 };
  const FNT = { '1':'x-small', '2':'small', '4':'large', '5':'x-large', '6':'xx-large', '7':'xxx-large' };
  const walk = n => {
    if(n.nodeType===3) return esc(n.nodeValue);
    if(n.nodeType!==1) return '';
    const t = n.tagName.toLowerCase();
    const kids = () => Array.from(n.childNodes).map(walk).join('');
    if(t==='br') return '<br>';
    if(t==='script' || t==='style') return '';
    if(t==='div' || t==='p'){ const k = kids(); return '<div>'+(k || '<br>')+'</div>'; }
    if(t==='ul' || t==='ol'){
      const k = Array.from(n.childNodes).filter(c => c.nodeType===1 && c.tagName.toLowerCase()==='li').map(walk).join('');
      return k ? '<'+t+(t==='ul' && n.classList.contains('dash') ? ' class="dash"' : '')+'>'+k+'</'+t+'>' : '';
    }
    if(t==='li'){ const k = kids(); return '<li>'+(k || '<br>')+'</li>'; }
    if(t==='a'){
      const hr = cleanUrl(n.getAttribute('href')), k = kids();
      return hr && k ? '<a href="'+hr.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+k+'</a>' : k;
    }
    if(t==='span' && n.classList.contains('mck')){
      const on = n.classList.contains('on') || /☑/.test(n.textContent);
      return '<span class="mck'+(on?' on':'')+'" contenteditable="false">'+(on?'☑':'☐')+'</span>';
    }
    let k = kids(); if(!k) return '';
    let bold = t==='b' || t==='strong', und = t==='u', col = '', bg = '', fs = '';
    if(t==='font'){
      const c = n.getAttribute('color'); if(c && colorOk(c) && !isDef(c)) col = c;
      fs = FNT[n.getAttribute('size')] || '';
    }
    const st = n.style;
    if(st){
      if(st.color && colorOk(st.color) && !isDef(st.color)) col = st.color;
      if(st.backgroundColor && colorOk(st.backgroundColor) && !isDef(st.backgroundColor)) bg = st.backgroundColor;
      if(FSZ[st.fontSize]) fs = st.fontSize;
      if(st.fontWeight==='bold' || +st.fontWeight>=600) bold = true;
      if(/underline/.test(st.textDecorationLine || st.textDecoration || '')) und = true;
    }
    const css = (col ? 'color:'+col+';' : '') + (bg ? 'background-color:'+bg+';'+(col ? '' : 'color:#1f2937;') : '') + (fs ? 'font-size:'+fs+';' : '');
    if(css) k = '<span style="'+css+'">'+k+'</span>';
    if(und) k = '<u>'+k+'</u>';
    if(bold) k = '<b>'+k+'</b>';
    return k;
  };

function memoText(html){
  const doc = new DOMParser().parseFromString('<!doctype html><body>'+String(html||''), 'text/html');
  let out = '';
  const nl = () => { if(out && !out.endsWith('\n')) out += '\n'; };
  const walk = n => {
    if(n.nodeType===3){ out += n.nodeValue.replace(/ /g,' '); return; }
    if(n.nodeType!==1) return;
    const t = n.tagName.toLowerCase();
    if(t==='br'){ out += '\n'; return; }
    if(t==='span' && n.classList.contains('mck')){ out += n.classList.contains('on') ? '☑' : '☐'; return; }
    if(t==='li'){
      nl();
      const p = n.parentNode;
      if(p && p.tagName.toLowerCase()==='ol'){ let i = 1, s = n; while((s = s.previousElementSibling)) i++; out += i+'. '; }
      else out += (p && p.classList && p.classList.contains('dash')) ? '— ' : '• ';
      n.childNodes.forEach(walk); nl(); return;
    }
    if(t==='div' || t==='ul' || t==='ol'){ nl(); n.childNodes.forEach(walk); nl(); return; }
    n.childNodes.forEach(walk);
  };

/* ===================== 링크 탭: 파일 종류 표시 · PC 경로 · 드라이브 파일 붙이기 ===================== */
const LK_KINDS = {
  pdf:{ t:'PDF', c:'#e11d48' }, xls:{ t:'XLS', c:'#16a34a' }, doc:{ t:'DOC', c:'#2563eb' }, ppt:{ t:'PPT', c:'#f97316' },
  img:{ t:'IMG', c:'#ec4899' }, folder:{ t:'폴더', c:'#d97706' }, zip:{ t:'ZIP', c:'#64748b' }, txt:{ t:'TXT', c:'#64748b' },
  hwp:{ t:'HWP', c:'#0ea5e9' }, file:{ t:'파일', c:'#64748b' }, path:{ t:'경로', c:'#8b5cf6' }, link:{ t:'링크', c:'#0ea5e9' }
};
function extKind(e){
  e = String(e||'').toLowerCase();
  if(e==='pdf') return 'pdf';
  if(/^(xlsx?|xlsm|xlsb|csv)$/.test(e)) return 'xls';
  if(/^(docx?|rtf)$/.test(e)) return 'doc';
  if(/^(pptx?)$/.test(e)) return 'ppt';
  if(/^(jpe?g|png|gif|webp|heic|heif|bmp)$/.test(e)) return 'img';
  if(/^(zip|7z|rar)$/.test(e)) return 'zip';
  if(/^(txt|md)$/.test(e)) return 'txt';
  if(/^hwpx?$/.test(e)) return 'hwp';
  return '';
}
const extOf = s => ((String(s||'').split(/[?#]/)[0].match(/\.([a-z0-9]{1,5})$/i)||[])[1]||'');
// 드라이브 파일 종류 (MIME 또는 이름 확장자)
function driveKind(mime, name){
  const m = String(mime||'').toLowerCase();
  if(m==='application/vnd.google-apps.folder') return 'folder';
  if(m==='application/pdf') return 'pdf';
  if(/spreadsheet|ms-excel|csv/.test(m)) return 'xls';
  if(/wordprocessing|msword|google-apps\.document/.test(m)) return 'doc';
  if(/presentation|powerpoint/.test(m)) return 'ppt';
  if(/^image\//.test(m)) return 'img';
  if(/zip/.test(m)) return 'zip';
  return extKind(extOf(name)) || 'file';
}
// 링크 한 개의 종류 (저장된 종류 → 이름/주소의 확장자 → 구글 문서 주소 → 일반 링크)
function linkKind(u){
  if(u.k && LK_KINDS[u.k]) return LK_KINDS[u.k];
  const byName = extKind(extOf(u.name)), byUrl = extKind(extOf(u.url||u.path));
  if(byName || byUrl) return LK_KINDS[byName || byUrl];
  const s = String(u.url||'');
  if(/docs\.google\.com\/document/.test(s)) return LK_KINDS.doc;
  if(/docs\.google\.com\/spreadsheets/.test(s)) return LK_KINDS.xls;
  if(/docs\.google\.com\/presentation/.test(s)) return LK_KINDS.ppt;
  if(/drive\.google\.com\/drive\/(u\/\d+\/)?folders/.test(s)) return LK_KINDS.folder;
  if(/drive\.google\.com\/file/.test(s)) return LK_KINDS.file;
  return u.path && !u.url ? LK_KINDS.path : LK_KINDS.link;
}

/* ===================== 엑셀 붙여넣기 / 복사 ===================== */
function parseTSV(text){
  const rows = []; let row = [], cell = '', q = false;
  text = String(text).replace(/\r\n?/g, '\n');
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch==='"' && cell===''){ q = true; }
    else if(ch==='\t'){ row.push(cell); cell = ''; }
    else if(ch==='\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const isUrlCell = t => /^https?:\/\/\S+$/i.test(t);
function rowsToTree(rows){
  const root = { text:null, kids:[], urls:[] }, path = [];
  for(const row of rows){
    let last = null;
    for(let c=0;c<row.length;c++){
      const t = String(row[c]||'').trim(); if(!t) continue;
      if(isUrlCell(t)){
        const cu = cleanUrl(t);
        if(last){ if(cu) last.urls.push(cu); continue; }
        // 행의 첫 값이 주소뿐이면 도메인 이름의 노드로 만든다
        const nd = { text:hostOf(t), kids:[], urls:cu?[cu]:[] };
        let par = root; for(let j=c-1;j>=0;j--){ if(path[j]){ par = path[j]; break; } }
        par.kids.push(nd); path[c] = nd; path.length = c+1; last = nd; continue;
      }
      let par = root; for(let j=c-1;j>=0;j--){ if(path[j]){ par = path[j]; break; } }
      const nd = { text:t, kids:[], urls:[] };
      par.kids.push(nd); path[c] = nd; path.length = c+1; last = nd;
    }
  }
  return root;
}
function countTree(t){ let c = 0; (function w(x){ x.kids.forEach(k => { c++; w(k); }); })(t); return c; }
function depthTree(t){ let d = 0; (function w(x,l){ x.kids.forEach(k => { d = Math.max(d,l+1); w(k,l+1); }); })(t,0); return d; }
function addTreeTo(nodes, pid, kids){
  kids.forEach(k => {
    const c = mkNode({ parent:pid, text:k.text, urls:k.urls.map(u => ({ id:uid(), name:'', url:u })) });
    nodes[c.id] = c; nodes[pid].children.push(c.id);
    addTreeTo(nodes, c.id, k.kids);
  });
}
function pasteNewMap(tree, center){
  const m2 = newMap(center || '중심 주제');
  data.maps[m2.id] = m2; data.order.push(m2.id);
  addTreeTo(m2.nodes, m2.rootId, tree.kids);
  refitAll(m2);
  switchMap(m2.id);
  applyLayout(m2.rootId, 'right', true);
}
function pasteUnder(tree, pid){
  let firstId = null;
  mutate(m => {
    const p = m.nodes[pid], gp = GAPS[S().gap], ctx = { main:gp.main, cross:gp.cross };
    const V = mkNode({ id:'__v', parent:p.parent, w:0, h:0 });
    m.nodes.__v = V;
    addTreeTo(m.nodes, '__v', tree.kids);
    (function fitAllUnder(id,d){ const n = m.nodes[id]; fit(n,d); n.children.forEach(c => fitAllUnder(c,d+1)); })('__v', depthOf(p));
    V.w = 0; V.h = 0;
    const md = (p.id===m.rootId || dirOf(p)>=0) ? 'right' : 'left', dir = md==='right' ? 1 : -1;
    const L = layoutLocal(V, md, ctx);
    const vx = p.x + dir*p.w/2;
    const ds = desc(p.id).map(i => m.nodes[i]);
    const vy = ds.length ? (bboxOf(ds).b + gp.cross*2 - L.bb.t) : (p.y - (L.bb.t+L.bb.b)/2);
    for(const id in L.pos){ if(id==='__v') continue; const q = m.nodes[id]; q.x = Math.round(vx+L.pos[id][0]); q.y = Math.round(vy+L.pos[id][1]); }
    V.children.forEach(c => { m.nodes[c].parent = pid; p.children.push(c); });
    if(V.children.length) firstId = V.children[0];
    delete m.nodes.__v;
    p.collapsed = false;
  });
  let overlap = false;
  if(firstId){
    sel = firstId; render(); ensureVisible(firstId);
    const nodes = N();
    const newIds = new Set(); N()[pid].children.slice(-tree.kids.length).forEach(c => { newIds.add(c); desc(c).forEach(d => newIds.add(d)); });
    const olds = Object.values(nodes).filter(n => !newIds.has(n.id));
    for(const id of newIds){ const a = nodes[id]; if(olds.some(b => Math.abs(a.x-b.x) < (a.w+b.w)/2-1 && Math.abs(a.y-b.y) < (a.h+b.h)/2-1)){ overlap = true; break; } }
  }
  return overlap;
}

function toTSV(rootId){
  const m = cur(), rows = [], pend = [];
  const q = s => /[\t\n"]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  const root = m.nodes[rootId];
  const go = (id,col) => {
    const n = m.nodes[id];
    pend.push({ col, t:n.text||'' });
    if(!n.children.length || n.urls.length){
      const cells = [];
      pend.forEach(p => { cells[p.col] = p.t; }); pend.length = 0;
      for(let i=0;i<=col;i++) if(cells[i]==null) cells[i] = '';
      n.urls.forEach(u => cells.push(u.url || u.path));
      rows.push(cells);
    }
    n.children.forEach(c => go(c, col+1));

const dow = ds => parseYmd(ds).getDay();
const fmtKo = ds => { const [y,m,d] = ds.split('-').map(Number); return y+'년 '+m+'월 '+d+'일'; };
const fmtMD = ds => { const [,m,d] = ds.split('-').map(Number); return m+'월 '+d+'일 ('+DOW[dow(ds)]+')'; };
const REPEAT_LABEL = { none:'반복 안 함', daily:'매일', weekly:'매주', monthly:'매월', yearly:'매년' };

function occurs(ev, ds){
  if(ds < ev.date) return false;
  if(!ev.repeat || ev.repeat==='none') return ds <= (ev.endDate || ev.date);
  if(ev.until && ds > ev.until) return false;
  const [by,bm,bd] = ev.date.split('-').map(Number), [y,m,d] = ds.split('-').map(Number);
  const last = daysIn(y,m);
  switch(ev.repeat){
    case 'daily': return true;
    case 'weekly': return dayDiff(ev.date, ds) % 7 === 0;
    case 'monthly': return d === Math.min(bd, last);
    case 'yearly': return m===bm && d === Math.min(bd, last);
  }
  return false;
}
function eventsOn(ds, withDone){
  const out = [];
  for(const id in data.events){ const ev = data.events[id]; if(occurs(ev, ds) && (withDone || !doneOf(ev, ds))) out.push(ev); }
  out.sort((a,b) => (doneOf(a,ds)?1:0)-(doneOf(b,ds)?1:0) || (a.ord==null ? 1e15 : a.ord)-(b.ord==null ? 1e15 : b.ord) || (a.allDay?0:1)-(b.allDay?0:1) || (a.time||'').localeCompare(b.time||'') || a.title.localeCompare(b.title));

}

function evDateText(ev){
  let t = fmtKo(ev.date)+' ('+DOW[dow(ev.date)]+')';
  if(ev.endDate && ev.endDate!==ev.date && ev.repeat==='none') t += ' ~ '+fmtKo(ev.endDate)+' ('+DOW[dow(ev.endDate)]+')';
  if(!ev.allDay && ev.time) t += ' '+ev.time+(ev.endTime ? '~'+ev.endTime : '');
  if(ev.repeat && ev.repeat!=='none') t += ' · '+REPEAT_LABEL[ev.repeat];
  return t;
}
function parseDateText(t){
  const re = /(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/g, ds = []; let m;
  while((m = re.exec(t)) && ds.length<2){
    const y = +m[1], mo = +m[2], d = +m[3];
    if(mo<1 || mo>12 || d<1 || d>daysIn(y,mo)) return null;
    ds.push(y+'-'+pad(mo)+'-'+pad(d));
  }
  if(!ds.length) return null;
  const rest = t.replace(/\d{4}\s*[-./년]\s*\d{1,2}\s*[-./월]\s*\d{1,2}/g, ' ');
  const tms = [...rest.matchAll(/(\d{1,2}):(\d{2})/g)].filter(x => +x[1]<24 && +x[2]<60).map(x => pad(+x[1])+':'+x[2]);
  return { date:ds[0], endDate:(ds[1] && ds[1]>ds[0]) ? ds[1] : '', time:tms[0]||'', endTime:tms[1]||'' };
}

/* ===================== 대한민국 공휴일 · 주 번호 ===================== */
// 음력 기준 날짜(양력 환산)는 2025~2030년을 내장. 고정 공휴일과 대체공휴일은 규칙으로 계산.
function krHolidays(y){
  const C = krHolidays.cache || (krHolidays.cache = {});
  if(C[y]) return C[y];
  const LUN = {
    2025:{ s:'2025-01-29', c:'2025-10-06', b:'2025-05-05' }, 2026:{ s:'2026-02-17', c:'2026-09-25', b:'2026-05-24' },
    2027:{ s:'2027-02-07', c:'2027-09-15', b:'2027-05-13' }, 2028:{ s:'2028-01-26', c:'2028-10-03', b:'2028-05-02' },
    2029:{ s:'2029-02-13', c:'2029-09-22', b:'2029-05-20' }, 2030:{ s:'2030-02-03', c:'2030-09-12', b:'2030-05-09' }
  };
  const TMP = { '2025-01-27':'임시공휴일', '2025-06-03':'선거일', '2026-06-03':'선거일', '2028-04-12':'선거일' };
  const pd = n => (n<10?'0':'')+n, M = {};
  const wk = ds => parseYmd(ds).getDay();
  const put = (ds, name) => { if(!M[ds]) M[ds] = name; };
  const singles = [[y+'-01-01','신정',0], [y+'-03-01','삼일절',1], [y+'-05-05','어린이날',1], [y+'-06-06','현충일',0],
    [y+'-08-15','광복절',1], [y+'-10-03','개천절',1], [y+'-10-09','한글날',1], [y+'-12-25','성탄절',1]];
  const L = LUN[y];
  if(L) singles.push([L.b,'부처님오신날',1]);
  singles.forEach(([ds,nm]) => put(ds, nm));
  const blocks = [];  // 설날·추석 (앞뒤 하루씩)
  if(L){
    [[L.s,'설날','설 연휴'], [L.c,'추석','추석 연휴']].forEach(([d0,n0,n1]) => {
      put(addDays(d0,-1), n1); put(d0, n0); put(addDays(d0,1), n1);
      blocks.push([addDays(d0,-1), addDays(d0,1)]);
    });
  }
  Object.keys(TMP).forEach(ds => { if(ds.slice(0,4)==String(y)) put(ds, TMP[ds]); });
  // 대체공휴일: 단일 공휴일이 토·일 또는 다른 공휴일과 겹치면 / 설·추석은 일요일 또는 다른 공휴일과 겹치면
  const subs = [];
  const need = [];
  singles.forEach(([ds,,eligible]) => {
    if(!eligible) return;
    const w = wk(ds);
    let over = false;
    blocks.forEach(([a,b]) => { if(ds>=a && ds<=b) over = true; });
    if(singles.filter(x => x[0]===ds).length>1) over = true;
    if(w===0 || w===6 || over) need.push(ds);
  });
  // 부처님오신날과 어린이날이 같은 날이면 대체는 한 번만
  const seen = {}; const uniq = need.filter(d => seen[d] ? false : (seen[d] = true));
  blocks.forEach(([a,b]) => {
    let hit = false;
    for(let d = a; d<=b; d = addDays(d,1)) if(wk(d)===0) hit = true;
    if(hit) uniq.push(b);
  });
  uniq.sort().forEach(ds => {
    let d = addDays(ds,1);
    while(M[d] || wk(d)===0 || wk(d)===6) d = addDays(d,1);
    if(d.slice(0,4)==String(y)){ M[d] = '대체휴일'; }
  });
  return (C[y] = M);
}
function krHoliday(ds){ return krHolidays(+ds.slice(0,4))[ds] || ''; }
function isoWeek(ds){
  const [y,m,d] = ds.split('-').map(Number);
  const t = new Date(Date.UTC(y,m-1,d)); const n = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate()+4-n);

/* ===================== 일정 막대 끌어서 늘이기 · 줄이기 ===================== */
// 막대의 앞(시작)·뒤(끝) 가장자리를 끌면 시작일·종료일이 바뀐다. 반복 일정은 제외.

function rzHandle(edge, ev, ctx, ds0){

/* ===================== 기간 일정 막대 (월 · 주) ===================== */
const isSpan = ev => !!(ev.endDate && ev.endDate > ev.date && (!ev.repeat || ev.repeat==='none'));
// 막대 조각들에 줄(lane)을 배정한다. maxLanes 를 넘는 것은 빼고 날짜별 개수(more)로 센다.
function packBars(items, maxLanes){
  const occ = [], bars = [], more = [0,0,0,0,0,0,0];
  for(const it of items){
    let ln = 0;
    for(;; ln++){
      if(!occ[ln]) occ[ln] = new Array(7).fill(false);
      let free = true; for(let c=it.c1;c<=it.c2;c++){ if(occ[ln][c]){ free = false; break; } }
      if(free) break;
    }
    if(maxLanes && ln>=maxLanes){ for(let c=it.c1;c<=it.c2;c++) more[c]++; continue; }
    for(let c=it.c1;c<=it.c2;c++) occ[ln][c] = true;
    it.lane = ln; bars.push(it);
  }
  return { bars, more, n:bars.reduce((m, b) => Math.max(m, b.lane+1), 0) };
}
// 한 주(ws부터 7일)의 일정을 막대 조각으로 만든다. withSingles 이면 하루짜리 일정도 막대로 만든다.
function spanBars(ws, maxLanes, withSingles){
  const we = addDays(ws, 6);
  const evs = Object.values(data.events).filter(ev => isSpan(ev) && !doneOf(ev, ev.date) && ev.date<=we && ev.endDate>=ws);
  evs.sort((a, b) => a.date.localeCompare(b.date) || b.endDate.localeCompare(a.endDate) || (a.title||'').localeCompare(b.title||''));
  const items = evs.map(ev => ({ ev, c1:Math.max(0, dayDiff(ws, ev.date)), c2:Math.min(6, dayDiff(ws, ev.endDate)), l:ev.date<ws, r:ev.endDate>we }));   // l: 앞 주에서 이어짐 · r: 다음 주로 이어짐
  if(withSingles){
    for(let i=0;i<7;i++){ const ds = addDays(ws, i); eventsOn(ds).forEach(ev => { if(!isSpan(ev)) items.push({ ev, c1:i, c2:i, l:false, r:false, single:true, ds }); }); }
  }
  items.sort((a, b) => (a.ev.ord==null ? 1e15 : a.ev.ord)-(b.ev.ord==null ? 1e15 : b.ev.ord));   // 정렬은 안정적이라 순서 미지정 일정은 기존 순서 유지
  return packBars(items, maxLanes);
}
// 완료 기록: 일정의 시점(s)에서 완료한 날(d)까지
function doneItems(){
  const out = [];
  for(const id in data.events){
    const ev = data.events[id]; if(!ev.dn) continue;
    for(const k of Object.keys(ev.dn)){ out.push({ ev, s:isRep(ev) ? k : ev.date, d:ev.dn[k] }); }
  }
  return out;
}
function doneBars(ws, maxLanes){
  const we = addDays(ws, 6), items = [];
  doneItems().forEach(x => {
    const lo = x.s<x.d ? x.s : x.d, hi = x.s<x.d ? x.d : x.s, fwd = x.d>=x.s;
    if(lo>we || hi<ws) return;
    items.push({ ev:x.ev, s:x.s, d:x.d, lo, c1:Math.max(0, dayDiff(ws, lo)), c2:Math.min(6, dayDiff(ws, hi)),
      l:fwd ? lo<ws : true, r:fwd ? true : hi>we, gray:true, ds:x.s });   // 화살표는 완료한 쪽 끝에 붙는다
  });
  items.sort((a, b) => a.lo.localeCompare(b.lo) || (b.c2-b.c1)-(a.c2-a.c1) || (a.ev.title||'').localeCompare(b.ev.title||''));
  return packBars(items, maxLanes);
}
function barEl(b, ds0, pos, ctx){
  const ev = b.ev, gray = !!b.gray, tc = gray ? '#fff' : (ev.color==='#eab308' ? '#422006' : '#fff');

function monthGrid(body, done){
  const a = parseYmd(cal.date), y = a.getFullYear(), mo = a.getMonth();

    const ws = addDays(start, w*7), sp = done ? doneBars(ws, maxL) : spanBars(ws, maxL, true);

      if(sp.n) cell.append(h('div',{class:'cspc', style:'--n:'+sp.n}, hn)); else if(hn) cell.append(hn);
      if(sp.more[wd]) cell.append(h('span',{class:'cmore'}, '+'+sp.more[wd]));

    sp.bars.forEach(b => grid.append(barEl(b, b.ds || addDays(ws, b.c1), 'grid-row:'+(w+2)+';grid-column:'+(b.c1+2)+'/'+(b.c2+3)+';margin-top:calc(47px + var(--bs)*'+b.lane+')', done ? null : { kind:'month' })));

function startMs(ev, ds){

  if(!ev.allDay && ev.time){ const [hh,mm] = ev.time.split(':').map(Number); d.setHours(hh,mm,0,0); }

function checkAlarms(){
  if(!sheetWrap.classList.contains('hidden')) return;
  const now = Date.now(), t = todayStr(), seen = data.alarmSeen || (data.alarmSeen = {}), fire = [];
  for(const ds of [addDays(t,-1), t, addDays(t,1), addDays(t,2)]){
    for(const ev of eventsOn(ds)){
      if(ev.alarm==null) continue;
      if(ev.repeat==='none' && ds!==ev.date) continue;
      const k = ev.id+'|'+ds; if(seen[k]) continue;
      const st = startMs(ev, ds), tr = st - ev.alarm*60000, end = ev.allDay ? st+864e5 : st+2*3600e3;
      if(tr<=now && now<=end) fire.push({ ev, ds, k });

  fire.forEach(x => { seen[x.k] = 1; });
  const keep = addDays(t,-3);
  for(const k in seen){ if(k.split('|')[1] < keep) delete seen[k]; }
  saveSoon(); showAlarms(fire);
}

  function jumpTarget(r, c, dr, dc){ // Ctrl+방향키: 데이터 덩어리의 끝으로

    while(inb(rr,cc) && !has(rr,cc)){ rr += dr; cc += dc; }

const GS_CODE = "/**\n * 마인드맵 · 일정 앱 — 동기화 + 구글 캘린더 업로드용 Apps Script\n *\n * [설치 방법]\n * 1) https://script.google.com 에서 「새 프로젝트」를 만들고, 이 코드를 전부 붙여넣습니다.\n * 2) 아래 TOKEN 을 나만 아는 긴 문자열로 바꿉니다. (앱의 「비밀키」 칸에 똑같이 입력)\n * 3) 왼쪽 톱니(프로젝트 설정) → 「시간대」를 Asia/Seoul 로 맞춥니다.\n * 4) 위쪽 함수 선택에서 `authorize` 를 고르고 ▶ 실행 → 권한 허용\n *    (드라이브 파일 1개, 캘린더 접근 권한을 묻습니다)\n * 5) 오른쪽 위 「배포」 → 「새 배포」 → 유형 「웹 앱」\n *      · 다음 사용자로 실행: 나\n *      · 액세스 권한이 있는 사용자: 모든 사용자\n *    → 배포 후 나오는 「웹 앱 URL」(…/exec)을 앱의 「웹앱 URL」 칸에 붙여넣습니다.\n * 6) 코드를 고쳤다면 「배포 관리 → 수정 → 새 버전」으로 다시 배포해야 반영됩니다.\n *\n * [동작]\n * - 동기화: 드라이브에 JSON 파일 1개(FILE_NAME)를 만들어 앱 데이터를 저장합니다.\n *   (다른 기기에서 먼저 바뀌었으면 덮어쓰지 않고 「충돌」로 알려 줍니다.)\n * - 캘린더 업로드: 앱의 일정을 구글 캘린더로 한 방향으로만 올립니다.\n *   같은 일정을 다시 올리면 새로 만들지 않고 기존 것을 갱신합니다.\n *   내 캘린더 목록에서 올릴 캘린더를 고를 수 있고, 일정마다 다른 캘린더로도 올릴 수 있습니다.\n * - 파일 붙이기: 드라이브에서 파일을 찾아 링크를 붙이거나, 앱에서 고른 파일을 「마인드맵 첨부」 폴더에 올려 링크를 붙입니다.\n * - 캘린더 가져오기: 고른 캘린더의 일정을 기간을 정해 앱으로 읽어 갑니다. (구글 → 앱, 읽기만 하고 구글은 바꾸지 않아요)\n */\n\nvar TOKEN = '여기에-나만-아는-긴-비밀키를-입력';\nvar FILE_NAME = 'mindmap-sync.json';\nvar CALENDAR_ID = ''; // 비우면 내 기본 캘린더. 다른 캘린더에 올리려면 캘린더 ID 입력\nvar MAX_BYTES = 8 * 1024 * 1024;\nvar ATTACH_FOLDER = '마인드맵 첨부'; // 앱에서 올린 파일이 모이는 드라이브 폴더 (나만 볼 수 있어요)\nvar MAX_UPLOAD = 20 * 1024 * 1024;\n\n/** 처음 한 번 실행해서 권한을 허용하는 용도 */\nfunction authorize() {\n  DriveApp.getRootFolder();\n  CalendarApp.getDefaultCalendar();\n  CalendarApp.getAllOwnedCalendars();\n  DriveApp.getFiles();\n  Logger.log('권한 확인 완료');\n}\n\nfunction doGet(e) {\n  return respond_(route_((e && e.parameter) || {}, null));\n}\n\nfunction doPost(e) {\n  var body = {};\n  try { body = JSON.parse((e.postData && e.postData.contents) || '{}'); } catch (err) { return respond_({ ok: false, error: '잘못된 요청(JSON)' }); }\n  return respond_(route_((e && e.parameter) || {}, body));\n}\n\nfunction respond_(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction route_(params, body) {\n  var src = body || params;\n  var token = String(src.token || params.token || '');\n  if (!TOKEN || TOKEN.indexOf('여기에') === 0) return { ok: false, error: '스크립트의 TOKEN 을 먼저 바꿔 주세요' };\n  if (token !== TOKEN) return { ok: false, error: '비밀키가 맞지 않아요' };\n  var action = String(src.action || params.action || 'ping');\n  try {\n    if (action === 'ping') return { ok: true, time: Date.now(), tz: Session.getScriptTimeZone() };\n    if (action === 'get') return getData_();\n    if (action === 'put') return putData_(body || {});\n    if (action === 'calendars') return listCalendars_();\n    if (action === 'events') return listEvents_(body || params);\n    if (action === 'dsearch') return driveSearch_(body || params);\n    if (action === 'dupload') return driveUpload_(body || {});\n    if (action === 'calendar') return calendarUpsert_(body || {});\n    if (action === 'gdelete') return calendarDelete_(body || {});\n    return { ok: false, error: '알 수 없는 요청: ' + action };\n  } catch (err) {\n    return { ok: false, error: String(err && err.message || err) };\n  }\n}\n\n/* ---------------- 드라이브 동기화 ---------------- */\n\nfunction findFile_() {\n  var it = DriveApp.getFilesByName(FILE_NAME);\n  return it.hasNext() ? it.next() : null;\n}\n\nfunction readBox_(file) {\n  try {\n    var o = JSON.parse(file.getBlob().getDataAsString('UTF-8'));\n    if (o && typeof o === 'object') return o;\n  } catch (e) { /* 손상된 파일은 없는 것으로 처리 */ }\n  return null;\n}\n\nfunction getData_() {\n  var f = findFile_();\n  if (!f) return { ok: true, empty: true, rev: 0 };\n  var box = readBox_(f);\n  if (!box) return { ok: true, empty: true, rev: 0 };\n  return { ok: true, rev: box.rev || 0, savedAt: box.savedAt || 0, data: box.data };\n}\n\nfunction putData_(body) {\n  if (!body.data || typeof body.data !== 'object') return { ok: false, error: '저장할 데이터가 없어요' };\n  var text = JSON.stringify(body.data);\n  if (text.length > MAX_BYTES) return { ok: false, error: '데이터가 너무 커요 (8MB 초과)' };\n  var lock = LockService.getScript le = r.addYearlyRule();\n  else return null;\n  if (ev.until) rule.until(addDays_(parseDate_(ev.until), 1));\n  return r;\n}\n\nfunction removeOld_(cal, props, key) {\n  var v = props.getProperty(key);\n  if (!v) return false;\n  try {\n    var kind = v.charAt(0), id = v.substring(2);\n    var obj = kind === 's' ? cal.getEventSeriesById(id) : cal.getEventById(id);\n    if (obj) obj.deleteEvent ? obj.deleteEvent() : obj.deleteEventSeries();\n  } catch (e) { /* 이미 구글에서 지웠으면 무시 */ }\n  props.deleteProperty(key);\n  return true;\n}\n\nfunction createOne_(cal, ev) {\n  var title = String(ev.title || '(제목 없음)');\n  var opts = { description: String(ev.memo || '') + (ev.memo ? '\\n\\n' : '') + '— 마인드맵 앱에서 올린 일정' };\n  var rec = buildRecurrence_(ev);\n  var made, kind;\n  if (ev.allDay) {\n    var s = parseDate_(ev.date);\n    if (rec) { made = cal.createAllDayEventSeries(title, s, rec, opts); kind = 's'; }\n    else if (ev.endDate && ev.endDate > ev.date) { made = cal.createAllDayEvent(title, s, addDays_(parseDate_(ev.endDate), 1), opts); kind = 'e'; }\n    else { made = cal.createAllDayEvent(title, s, opts); kind = 'e'; }\n  } else {\n    var st = parseDateTime_(ev.date, ev.time || '09:00');\n    var et;\n    if (ev.endTime) et = parseDateTime_(ev.endDate && !rec ? ev.endDate : ev.date, ev.endTime);\n    else et = new Date(st.getTime() + 3600000);\n    if (et.getTime() <= st.getTime()) et = new Date(st.getTime() + 3600000);\n    if (rec) { made = cal.createEventSeries(title, st, et, rec, opts); kind = 's'; }\n    else { made = cal.createEvent(title, st, et, opts); kind = 'e'; }\n  }\n  try {\n    made.removeAllReminders();\n    var a = ev.alarm;\n    if (a !== null && a !== undefined && a !== '' && Number(a) >= 0 && Number(a) <= 40320) made.addPopupReminder(Number(a));\n  } catch (e) { /* 알림 설정 실패는 무시 */ }\n  return kind + ':' + made.getId();\n}\n\nfunction calendarUpsert_(body) {\n  var list = body.events || [];\n  if (!list.length) return { ok: true, created: 0, updated: 0, failed: [] };\n  if (list.length > 500) return { ok: false, error: '한 번에 500개까지 올릴 수 있어요' };\n  var props = PropertiesService.getScriptProperties();\n  var cache = {};\n  var created = 0, updated = 0, failed = [], done = [];\n  var lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    list.forEach(function (ev) {\n      try {\n        if (!ev || !ev.id || !/^\\d{4}-\\d{2}-\\d{2}$/.test(ev.date || '')) throw new Error('날짜 형식 오류');\n        var key = 'ev_' + ev.id;\n        var cal = calOf_(cache, ev.calId || body.calendarId);          // 이 일정이 올라갈 캘린더\n        var oldCid = props.getProperty('evc_' + ev.id);                // 예전에 올린 캘린더\n        var oldCal = (oldCid && oldCid !== cal.getId()) ? calOf_(cache, oldCid) : cal;\n        var existed = removeOld_(oldCal, props, key);                  // 캘린더를 바꿨으면 옛 캘린더에서 지움\n        var ref = createOne_(cal, ev);\n        props.setProperty(key, ref);\n        props.setProperty('evc_' + ev.id, cal.getId());\n        if (existed) updated++; else created++;\n        done.push(ev.id);\n      } catch (err) {\n        failed.push({ id: ev && ev.id, error: String(err && err.message || err) });\n      }\n    });\n  } finally {\n    lock.releaseLock();\n  }\n  return { ok: true, created: created, updated: updated, failed: failed, done: done };\n}\n\n/* ---------------- 구글 캘린더 가져오기 (구글 → 앱, 읽기 전용) ---------------- */\n\nfunction fmt_(d, f) { return Utilities.formatDate(d, Session.getScriptTimeZone(), f); }\n\nfunction listEvents_(body) {\n  var ids = body.calendarIds || [];\n  if (typeof ids === 'string') ids = ids.split(',');\n  if (!ids.length) return { ok: false, error: '가져올 캘린더를 고르세요' };\n  var from = String(body.from || ''), to = String(body.to || '');\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(from) || !/^\\d{4}-\\d{2}-\\d{2}$/.test(to)) return { ok: false, error: '기간 형식 오류' };\n  var start = parseDate_(from), end = addDays_(parseDate_(to), 1);\n  if (end.getTime() <= start.getTime()) return { ok: false, error: '끝 날짜가 시작 날짜보다 빨라요' };\n  if ((end.getTime() - start.getTime()) / 86400000 > 800) return { ok: false, error: '기간은 최대 800일까지 가능해요' };\n  // 앱에서 올린 일정(구글 ID)은 되돌려 받지 않도록 제외\n  var all = PropertiesService.getScriptProperties().getProperties();\n  var mine = {};\n  Object.keys(all).forEach(function (k) { if (k.indexOf('ev_') === 0) mine[String(all[k]).substring(2)] = 1; });\n  var out = [], skipped = 0, missing = [];\n  ids.forEach(function (cid) {\n    var cal = CalendarApp.getCalendarById(cid);\n    if (!cal) { missing.push(cid); return; }\n    cal.getEvents(start, end).forEach(function (e) {\n      var gid = e.getId();\n      if (mine[gid]) { skipped++; return; }\n      var allDay = e.isAllDayEvent();\n      var st = e.getStartTime(), en = e.getEndTime();\n      var date, endDate = '', time = '', endTime = '';\n      if (allDay) {\n        date = fmt_(e.getAllDayStartDate(), 'yyyy-MM-dd');\n        var last = fmt_(addDays_(e.getAllDayEndDate(), -1), 'yyyy-MM-dd');\n        if (last > date) endDate = last;\n      } else {\n        date = fmt_(st, 'yyyy-MM-dd'); time = fmt_(st, 'HH:mm');\n        var ed = fmt_(en, 'yyyy-MM-dd'), et = fmt_(en, 'HH:mm');\n        if (ed > date && et === '00:00' && fmt_(addDays_(en, -1), 'yyyy-MM-dd') === date) { /* 자정에 끝나는 하루 일정 */ }\n        else { endDate = ed > date ? ed : ''; endTime = et; }\n      }\n      var alarm = null;\n      try { var rs = e.getPopupReminders(); if (rs && rs.length) alarm = rs[0]; } catch (err) { /* 알림 정보 없음 */ }\n      var desc = '';\n      try { desc = String(e.getDescription() || '').replace(/\\n*— 마인드맵 앱에서 올린 일정\\s*$/, ''); } catch (err) { /* 설명 없음 */ }\n      out.push({ key: cid + '|' + gid + '|' + st.getTime(), cal: cid, title: e.getTitle() || '(제목 없음)',\n        date: date, endDate: endDate, allDay: allDay, time: time, endTime: endTime, memo: desc.slice(0, 5000),\n        alarm: alarm, recurring: e.isRecurringEvent() });\n    });\n  });\n  if (out.length > 2500) return { ok: false, error: '일정이 너무 많아요 (' + out.length + '개). 기간을 줄여 주세요' };\n  return { ok: true, events: out, skipped: skipped, missing: missing };\n}\n\n/* ---------------- 드라이브 파일 붙이기 (찾기 · 올리기) ---------------- */\n\nfunction attachFolder_() {\n  var it = DriveApp.getFoldersByName(ATTACH_FOLDER);\n  return it.hasNext() ? it.next() : DriveApp.createFolder(ATTACH_FOLDER);\n}\n\nfunction fileInfo_(f, isFolder) {\n  return {\n    id: f.getId(), name: f.getName(), url: f.getUrl(),\n    mime: isFolder ? 'application/vnd.google-apps.folder' : f.getMimeType(),\n    size: isFolder ? 0 : f.getSize(), updated: f.getLastUpdated().getTime()\n  };\n}\n\nfunction driveSearch_(body) {\n  var q = String(body.q || '').trim();\n  var out = [];\n  if (!q) { // 비우면 「마인드맵 첨부」 폴더의 최근 파일\n    var it0 = attachFolder_().getFiles();\n    while (it0.hasNext() && out.length < 300) out.push(fileInfo_(it0.next(), false));\n  } else {\n    var qq = q.replace(/\\\\/g, '\\\\\\\\').replace(/'/g, \"\\\\'\");\n    var it = DriveApp.searchFiles(\"title contains '\" + qq + \"' and trashed = false\");\n    while (it.hasNext() && out.length < 60) out.push(fileInfo_(it.next(), false));\n    var fo = DriveApp.searchFolders(\"title contains '\" + qq + \"' and trashed = false\");\n    var n = 0;\n    while (fo.hasNext() && n < 10) { out.push(fileInfo_(fo.next(), true)); n++; }\n  }\n  out.sort(function (a, b) { return b.updated - a.updated; });\n  return { ok: true, files: out.slice(0, 30) };\n}\n\nfunction driveUpload_(body) {\n  var name = String(body.name || '파일').replace(/[\\\\/:*?\"<>|]/g, '_').slice(0, 150);\n  if (!body.data) return { ok: false, error: '파일 내용이 없어요' };\n  var bytes = Utilities.base64Decode(String(body.data));\n  if (bytes.length > MAX_UPLOAD) return { ok: false, error: '파일이 너무 커요 (20MB 초과)' };\n  var blob = Utilities.newBlob(bytes, String(body.mime || 'application/octet-stream'), name);\n  var f = attachFolder_().createFile(blob);\n  return { ok: true, file: fileInfo_(f, false), name: f.getName(), url: f.getUrl(), mime: f.getMimeType() };\n}\n\nfunction calOf_(cache, id) {\n  var k = id || '_default';\n  if (!cache[k]) cache[k] = getCal_(id);\n  return cache[k];\n}\n\nfunction calendarDelete_(body) {\n  var ids = body.ids || [];\n  var props = PropertiesService.getScriptProperties();\n  var cache = {};\n  var n = 0;\n  ids.forEach(function (id) {\n    var cid = props.getProperty('evc_' + id) || body.calendarId;     // 올릴 때 쓴 캘린더에서 지움\n    if (removeOld_(calOf_(cache, cid), props, 'ev_' + id)) n++;\n    props.deleteProperty('evc_' + id);\n  });\n  return { ok: true, deleted: n };\n}\n";
/* ===================== 4단계: 동기화(드라이브) · 구글 캘린더 업로드 ===================== */
const SYNC_KEY = 'mindmap_sync_v1', PRESYNC_KEY = 'mindmap_presync_backup';
function loadSync(){
  const base = { url:'', token:'', auto:true, rev:0, sig:'', syncedAt:0, calId:'', cals:[], pending:false, sent:{} };
  try{ const o = JSON.parse(localStorage.getItem(SYNC_KEY)||'{}'); return Object.assign(base, o, { sent:(o.sent && typeof o.sent==='object') ? o.sent : {} }); }
  catch(e){ return base; }
}
let syncCfg = loadSync();
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); }catch(e){} }
const syncOn = () => !!(syncCfg.url && syncCfg.token);
const fmtDT = ms => { if(!ms) return '-'; const d = new Date(ms); return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+pad(d.getHours())+':'+pad(d.getMinutes()); };

function syncPayload(){ return { app:'mindmap', version:1, maps:data.order.map(id => data.maps[id]), events:Object.values(data.events), current:data.current }; }
// 기기마다 달라지는 값(노드 크기 w/h, 수정시각)은 변경 여부 판단에서 제외
const sigRep = (k,v) => (k==='w' || k==='h' || k==='updated' || (k && k[0]==='_')) ? undefined : v;
function sigOf(p){
  const s = JSON.stringify({ m:p.maps, e:p.events }, sigRep);
  let a = 5381, b = 52711;
  for(let i=0;i<s.length;i++){ const c = s.charCodeAt(i); a = ((a<<5)+a+c)|0; b = ((b<<5)+b)^c; b |= 0; }
  return (a>>>0).toString(36)+(b>>>0).toString(36)+s.length.toString(36);
}
const isDirty = () => sigOf(syncPayload()) !== syncCfg.sig;
const lastLocalChange = () => Math.max(0, ...data.order.map(id => data.maps[id].updated||0));
const isBlankLocal = () => data.order.length===1 && Object.keys(data.maps[data.order[0]].nodes).length<=1 && !Object.keys(data.events).length;

function gsErr(msg, kind){ const e = new Error(msg); e.kind = kind||'srv'; return e; }
async function gs(action, body){
  const url = String(syncCfg.url||'').trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) throw gsErr('웹앱 URL이 올바르지 않아요 (https://script.google.com/…/exec)','cfg');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), ((action==='calendar' || action==='events' || action==='dupload') ? 120000 : 30000));
  try{
    let res;
    if(body) res = await fetch(url, { method:'POST', body:JSON.stringify(Object.assign({ token:syncCfg.token, action }, body)), headers:{ 'Content-Type':'text/plain;charset=utf-8' }, signal:ctrl.signal, redirect:'follow' });
    else res = await fetch(url+(url.includes('?')?'&':'?')+'action='+action+'&token='+encodeURIComponent(syncCfg.token), { signal:ctrl.signal, redirect:'follow' });
    const txt = await res.text();
    let j; try{ j = JSON.parse(txt); }catch(e){ throw gsErr('서버 응답을 읽지 못했어요. 웹앱 URL(…/exec)과 「액세스: 모든 사용자」 배포를 확인하세요','bad'); }
    return j;
  }catch(e){
    if(e && e.kind) throw e;
    if(e && e.name==='AbortError') throw gsErr('서버 응답 시간이 초과됐어요','net');
    throw gsErr('인터넷에 연결할 수 없어요','net');
  }finally{ clearTimeout(timer); }
}

let syncBusy = false, lastSyncCheck = 0, syncMsg = '';
function syncStatus(){
  if(!syncOn()) return { t:'연결 안 됨', c:'#64748b' };
  if(syncBusy) return { t:'동기화 중…', c:'#0ea5e9' };
  if(syncCfg.pending) return { t:'오프라인 — 이 기기에 임시 저장됨 (연결되면 자동으로 올려요)', c:'#f59e0b' };
  if(isDirty()) return { t:'올리지 않은 변경이 있어요', c:'#f59e0b' };
  return { t:'최신 상태 · '+fmtDT(syncCfg.syncedAt), c:'#10b981' };
}
function refreshSyncUI(){
  const st = syncStatus();
  const el = document.getElementById('syncStat'); if(el){ el.textContent = st.t; el.style.setProperty('--c', st.c); }
  const dot = document.getElementById('calCloud'); if(dot){ dot.classList.toggle('warn', syncOn() && (syncCfg.pending || isDirty())); dot.classList.toggle('on', syncOn()); }
}

function backupLocal(){ try{ localStorage.setItem(PRESYNC_KEY, JSON.stringify(Object.assign(syncPayload(), { at:Date.now() }), jsonRep)); }catch(e){} }

function parseRemote(d){
  const maps = {}, order = [];
  ((d && d.maps) || []).forEach(raw => { const m = normalizeMap(raw, true); if(m){ maps[m.id] = m; order.push(m.id); } });
  return { maps, order, events:loadEvents(d && d.events), current:d && d.current };
}
function mapSig(m){ return JSON.stringify({ n:m.nodes, g:m.groups, l:m.links, r:m.rootId, name:m.name }, sigRep); }
function mergeBoth(remote){
  const loc = { maps:data.maps, order:data.order.slice(), events:data.events };
  const maps = Object.assign({}, remote.maps), order = remote.order.slice(), events = Object.assign({}, loc.events, remote.events);
  loc.order.forEach(id => {
    const lm = loc.maps[id];
    if(!maps[id]){ maps[id] = lm; order.push(id); }
    else if(mapSig(lm) !== mapSig(maps[id])){
      const copy = normalizeMap(JSON.parse(JSON.stringify(lm, jsonRep)), false);
      if(copy){ copy.name = (lm.name+' (이 기기)').slice(0,60); copy.updated = lm.updated; maps[copy.id] = copy; order.push(copy.id); }
    }
  });
  return { maps, order, events };
}
function applyRemote(r, how){
  const rem = parseRemote(r.data);
  if(!rem.order.length) throw gsErr('서버 데이터에 맵이 없어요','srv');
  backupLocal();
  const res = how==='both' ? mergeBoth(rem) : rem;
  const keepCur = data.current;
  data.maps = res.maps; data.order = res.order; data.events = res.events;
  data.current = res.maps[keepCur] ? keepCur : (res.maps[rem.current] ? rem.current : res.order[0]);
  for(const k in hist) delete hist[k];
  data.order.forEach(id => refitAll(data.maps[id]));
  closePanel(); mode = null; selLink = null; $('#modebar').classList.add('hidden');
  sel = null; focusId = null; viewStack = [];
  saveNow(); render(); renderCal(); viewReady = false; ensureView();
  if(how==='both'){ syncCfg.rev = r.rev; syncCfg.sig = ''; }   // 합친 결과는 아직 올리지 않은 상태로 둔다
  else{ syncCfg.rev = r.rev; syncCfg.sig = sigOf(syncPayload()); }
  syncCfg.syncedAt = r.savedAt || Date.now(); syncCfg.pending = false; saveSync();
}

async function syncUpload(baseRev, o, force){
  const p = syncPayload(), sig = sigOf(p);
  const j = await gs('put', { baseRev, force:!!force, data:JSON.parse(JSON.stringify(p, jsonRep)) });
  if(j.conflict){ return { state:'conflict' }; }
  if(!j.ok) throw gsErr(j.error||'저장 실패','srv');
  syncCfg.rev = j.rev; syncCfg.sig = sig; syncCfg.syncedAt = j.savedAt || Date.now(); syncCfg.pending = false; saveSync();
  if(!(o && o.silent)) toast('드라이브에 저장했어요');
  return { state:'pushed' };
}

async function syncNow(o){
  o = o||{};
  if(!syncOn()){ if(!o.silent) toast('먼저 웹앱 URL과 비밀키를 입력하세요'); return { state:'off' }; }
  if(syncBusy) return { state:'busy' };
  if(o.silent && (!sheetWrap.classList.contains('hidden') || pn)){ clearTimeout(autoT); autoT = setTimeout(() => syncNow(o), 20000); return { state:'deferred' }; }
  syncBusy = true; lastSyncCheck = Date.now(); refreshSyncUI();
  try{
    const r = await gs('get');
    if(!r.ok) throw gsErr(r.error||'서버 오류','srv');
    const dirty = isDirty();
    let out;
    if(r.empty || !r.data){ out = await syncUpload(0, o); }
    else{
      const changedRemote = r.rev !== syncCfg.rev;
      if(!changedRemote && !dirty){ if(!o.silent) toast('이미 최신 상태예요'); out = { state:'same' }; }
      else if(!changedRemote){ out = await syncUpload(r.rev, o); }
      else if(!dirty || (syncCfg.sig==='' && isBlankLocal())){ applyRemote(r); toast('드라이브의 최신 내용을 불러왔어요'); out = { state:'pulled' }; }
      else{ out = { state:'conflict', remote:r }; }
    }
    if(out.state==='conflict'){
      const rr = out.remote || await gs('get');
      openSyncConflict(rr);
    }
    syncCfg.pending = false; saveSync();
    return out;
  }catch(e){
    if(e.kind==='net'){ syncCfg.pending = isDirty(); saveSync(); if(!o.silent) toast('오프라인이에요. 변경 내용은 이 기기에 임시 저장돼 있고, 연결되면 자동으로 올려요'); }
    else if(!o.silent || e.kind==='bad' || e.kind==='cfg') toast('동기화 실패: '+e.message);
    return { state:'error', error:e };
  }finally{
    syncBusy = false; refreshSyncUI();
  }
}

function openSyncConflict(r){
  openSheet('⚠️ 동기화 충돌', b => {
    const remMaps = (r.data && r.data.maps || []).length;
    b.append(h('p',{class:'note',style:'color:var(--text);font-size:14px;line-height:1.55'},
      '마지막 동기화 이후 이 기기와 드라이브가 둘 다 바뀌었어요. 어느 쪽을 남길지 선택하세요. 어떤 선택을 해도 이 기기의 직전 상태는 「동기화 직전 상태 복원」으로 되돌릴 수 있어요.'),
      h('div',{class:'cmpbox'},
        h('div',{},h('b',{},'이 기기'),h('br'),'맵 '+data.order.length+'개 · 일정 '+Object.keys(data.events).length+'개',h('br'),'마지막 수정 '+fmtDT(lastLocalChange())),
        h('div',{},h('b',{},'드라이브'),h('br'),'맵 '+remMaps+'개 · 일정 '+(r.data && r.data.events || []).length+'개',h('br'),'저장 시각 '+fmtDT(r.savedAt))));
    b.append(h('div',{class:'list'},
      h('button',{class:'item',onclick:async () => { closeSheet(true); try{ applyRemote(Object.assign({}, r), 'both'); toast('두 내용을 합쳤어요. 확인 후 「지금 동기화」로 올리세요'); }catch(e){ toast('합치기 실패: '+e.message); } }},
        h('span',{class:'ico',style:'--c:#10b981',html:ic('copy',20)}), h('span',{class:'t'},'둘 다 보관 (합치기)'), h('span',{class:'s'},'다른 점이 있는 맵은 「이 기기」 사본으로 남겨요')),
      h('button',{class:'item',onclick:async () => { if(!confirm('드라이브 내용으로 이 기기를 바꿀까요?\n(이 기기의 변경은 복원 메뉴로 되돌릴 수 있어요)')) return; closeSheet(true); try{ applyRemote(r); toast('드라이브 내용으로 바꿨어요'); }catch(e){ toast('실패: '+e.message); } refreshSyncUI(); }},
        h('span',{class:'ico',style:'--c:#0ea5e9',html:ic('cloud',20)}), h('span',{class:'t'},'드라이브 내용으로 바꾸기'), h('span',{class:'s'},'이 기기의 변경은 버려요')),
      h('button',{class:'item',onclick:async () => { if(!confirm('이 기기 내용으로 드라이브를 덮어쓸까요?\n다른 기기에서 바꾼 내용은 사라져요.')) return; closeSheet(true); try{ await syncUpload(r.rev, {}, true); }catch(e){ toast('실패: '+e.message); } refreshSyncUI(); }},
        h('span',{class:'ico',style:'--c:#f59e0b',html:ic('upload',20)}), h('span',{class:'t'},'이 기기 내용으로 덮어쓰기'), h('span',{class:'s'},'드라이브의 변경은 버려요')),
      h('button',{class:'item',onclick:() => closeSheet(true)}, h('span',{class:'ico',style:'--c:#64748b',html:ic('x',18)}), h('span',{class:'t'},'나중에 결정'))));
  });
}

/* 자동 동기화: 변경 25초 뒤 올리기 · 앱 열 때/화면 돌아올 때/인터넷 복구 때 확인 */
let autoT = null;
function scheduleAuto(){
  if(!syncOn() || !syncCfg.auto) return;
  clearTimeout(autoT);
  autoT = setTimeout(() => { if(isDirty() || syncCfg.pending) syncNow({ silent:true }); }, 25000);
}
window.addEventListener('online', () => { if(syncOn() && syncCfg.auto && (syncCfg.pending || isDirty())) syncNow({ silent:true }); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='visible' && syncOn() && syncCfg.auto && Date.now()-lastSyncCheck>60000) syncNow({ silent:true });
});

/* ---------- 구글 캘린더 업로드 (앱 → 구글, 한 방향) ---------- */
/* 내 캘린더 목록 (Apps Script 의 calendars 요청) */
async function fetchCalendars(){
  const j = await gs('calendars');
  if(!j.ok){
    if(/알 수 없는 요청/.test(j.error||'')) throw gsErr('Apps Script 를 새 코드로 업데이트해야 목록을 불러올 수 있어요 (동기화 설정 → 코드 복사 → 새 버전으로 배포)','srv');
    throw gsErr(j.error||'목록을 불러오지 못했어요','srv');
  }
  syncCfg.cals = (j.calendars||[]).map(c => ({ id:String(c.id), name:String(c.name||c.id), color:String(c.color||''), def:!!c.def }));
  saveSync();
  return syncCfg.cals;
}

function gcalPayload(ev){
  return { id:ev.id, title:ev.title, date:ev.date, endDate:ev.endDate||'', allDay:!!ev.allDay, time:ev.time||'', endTime:ev.endTime||'', repeat:ev.repeat||'none', until:ev.until||'', alarm:ev.alarm, memo:ev.memo||'', calId:ev.gcal||'' };

async function uploadEvents(list, calId){
  if(!list.length){ toast('올릴 일정이 없어요'); return { ok:true, n:0 }; }
  let created = 0, updated = 0, failed = [];
  for(let i=0;i<list.length;i+=40){
    const chunk = list.slice(i, i+40);
    toast('구글 캘린더로 올리는 중… '+Math.min(i+40,list.length)+'/'+list.length);
    const j = await gs('calendar', { calendarId:calId||'', events:chunk.map(gcalPayload) });
    if(!j.ok) throw gsErr(j.error||'업로드 실패','srv');
    created += j.created||0; updated += j.updated||0; failed = failed.concat(j.failed||[]);
    (j.done||[]).forEach(id => { syncCfg.sent[id] = Date.now(); });
    saveSync();
  }

}
async function runUpload(list, calId){
