/* ---------- 구글 캘린더에서 가져오기 ---------- */
function impSigOf(e){
  const s = JSON.stringify([e.title||'', e.date||'', e.endDate||'', e.allDay?1:0, e.time||'', e.endTime||'', e.memo||'', e.alarm==null?'':e.alarm]);
  let a = 5381; for(let i=0;i<s.length;i++) a = ((a<<5)+a+s.charCodeAt(i))|0;
  return (a>>>0).toString(36)+s.length.toString(36);
}
function impNorm(it){
  const f = { title:String(it.title||'(제목 없음)').slice(0,200), date:it.date, allDay:!!it.allDay,
    endDate:(it.endDate && it.endDate>it.date) ? it.endDate : '', time:'', endTime:'', alarm:(it.alarm==null||!isFinite(+it.alarm)) ? null : +it.alarm,
    memo:String(it.memo||'').slice(0,5000) };
  if(!f.allDay){
    f.time = it.time || '09:00';
    f.endTime = it.endTime || '';
    if(!f.endDate && f.endTime && f.endTime<=f.time) f.endTime = '';
  }
  return f;
}
function mergeImported(items, overwrite){
  const byKey = {}; Object.values(data.events).forEach(e => { if(e.gimp && e.gimp.key) byKey[e.gimp.key] = e; });
  let added = 0, updated = 0, same = 0, kept = 0;
  items.forEach(it => {
    if(!it || !it.key || !/^\d{4}-\d{2}-\d{2}$/.test(it.date||'')) return;
    const f = impNorm(it), sig = impSigOf(f), ex = byKey[it.key];
    if(!ex){
      const ci = (syncCfg.cals||[]).findIndex(c => c.id===it.cal);
      const ev = Object.assign({ id:uid(), repeat:'none', until:'', color:EV_COLORS[(ci<0 ? 0 : ci) % EV_COLORS.length], gcal:'', link:null, created:Date.now(), gimp:{ key:it.key, cal:it.cal, sig } }, f);
      data.events[ev.id] = ev; byKey[it.key] = ev; added++;
    }else if(ex.gimp.sig===sig){ same++; }
    else{
      const edited = impSigOf(ex) !== ex.gimp.sig;          // 앱에서 따로 고친 일정
      if(edited && !overwrite){ kept++; return; }
      Object.assign(ex, f); ex.gimp.sig = sig;
      if(ex.link){ try{ pushEventToMap(ex); }catch(e){} }
      updated++;
    }
  });
  saveSoon(); renderCal();
  return { added, updated, same, kept };
}

function trashPush(item){
  const L = trashList(); item.id = uid(); item.ts = Date.now(); L.unshift(item);
  const cut = Date.now() - TRASH_DAYS*864e5;
  for(let i=L.length-1;i>=0;i--) if(L[i].ts < cut) L.splice(i,1);
  while(L.length > TRASH_MAX) L.pop();
  let bytes = JSON.stringify(L).length;
  while(bytes > TRASH_BYTES && L.length > 1){ L.pop(); bytes = JSON.stringify(L).length; }
}

let nodeClip = null;
function subtreeTSV(id){
  const m = cur(), rows = [], pend = [];
  const q = s => /[\t\n"]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  const go = (nid, col) => {
    const n = m.nodes[nid];
    pend.push({ col, t:n.text||'' });
    if(!n.children.length || n.urls.length){
      const cells = []; pend.forEach(p => { cells[p.col] = p.t; }); pend.length = 0;
      for(let i=0;i<=col;i++) if(cells[i]==null) cells[i] = '';
      n.urls.forEach(u => cells.push(u.url || u.path)); rows.push(cells);
    }
    n.children.forEach(c => go(c, col+1));
  };
  go(id, 0);
  return rows.map(r => r.map(q).join('\t')).join('\n');
}
function snapSubtree(id){

/* ---------- 검색 ---------- */
function searchAll(qs){
  const terms = String(qs||'').trim().toLowerCase().split(/\s+/).filter(Boolean); if(!terms.length) return [];
  const lc = s => String(s==null ? '' : s).toLowerCase();
  const first = s => { const L = lc(s); let best = -1, len = 0; for(const t of terms){ const i = L.indexOf(t); if(i>=0 && (best<0 || i<best)){ best = i; len = t.length; } } return best<0 ? null : { i:best, len }; };
  const out = [];
  for(const mid of data.order){
    const m = data.maps[mid];
    for(const id in m.nodes){
      const n = m.nodes[id];
      const tagL = (n.tag && TAGMAP[n.tag]) ? TAGMAP[n.tag][2] : '';
      let tbl = ''; if(n.table) for(const row of n.table.cells) for(const v of row) if(v) tbl += v+' ';
      const hay = lc([n.text, n.memo, tagL, n.due, n.checks.map(c => c.t).join(' '), n.urls.map(u => u.name+' '+u.url+' '+(u.path||'')).join(' '), tbl].join(' \n '));
      if(!terms.every(t => hay.includes(t))) continue;
      let hit = null, f;
      if((f = first(n.text))) hit = Object.assign({ where:'노드', text:n.text, tab:'node' }, f);
      else if((f = first(n.memo))) hit = Object.assign({ where:'메모', text:n.memo, tab:'memo' }, f);
      else if(tagL && (f = first(tagL))) hit = { where:'태그 · '+tagL, text:n.text || '(이름 없음)', tab:'node', i:0, len:0 };
      else{
        const ck = n.checks.find(c => first(c.t));
        if(ck) hit = Object.assign({ where:'체크', text:ck.t, tab:'checks' }, first(ck.t));
        else{
          const u = n.urls.find(x => first(x.name+' '+x.url+' '+(x.path||'')));
          if(u){ const s = first(u.name) ? u.name : (first(u.url) ? u.url : (u.path||'')); hit = Object.assign({ where:'링크', text:s, tab:'links' }, first(s) || { i:0, len:0 }); }
          else if(n.table){
            outer: for(let r=0;r<n.table.cells.length;r++) for(let c=0;c<n.table.cells[r].length;c++){
              const v = n.table.cells[r][c]; if(v && (f = first(v))){ hit = Object.assign({ where:'표 '+colName(c)+(r+1), text:v, tab:'table' }, f); break outer; }
            }
          }
          if(!hit && n.due && (f = first(n.due))) hit = { where:'기한 · '+n.due, text:n.text || '(이름 없음)', tab:'node', i:0, len:0 };
        }
      }
      if(!hit) hit = { where:'노드', text:n.text || '(이름 없음)', i:0, len:0, tab:'node' };   // 단어들이 서로 다른 칸에 나뉘어 있을 때
      out.push(Object.assign({ kind:'node', mapId:mid, mapName:m.name, id }, hit));
      if(out.length>=80) return out;
    }
  }
  for(const id in data.events){
    const ev = data.events[id];
    const hay = lc((ev.title||'')+' \n '+(ev.memo||'')+' \n '+ev.date);
    if(!terms.every(t => hay.includes(t))) continue;
    const f = first(ev.title) ? { text:ev.title, ...first(ev.title) } : (first(ev.memo) ? { text:ev.memo, ...first(ev.memo) } : { text:ev.title||'', i:0, len:0 });
    out.push(Object.assign({ kind:'event', id, where:'일정 '+ev.date, mapName:'' }, f));
    if(out.length>=100) break;
  }
  return out;
}
function snippet(text, i, len){
  const s = String(text).replace(/\s+/g,' ');
  const a = Math.max(0, i-14), part = s.slice(a, i+len+34);
  const rel = i - a;
  return (a>0 ? '…' : '')+esc(part.slice(0,rel))+'<mark>'+esc(part.slice(rel, rel+len))+'</mark>'+esc(part.slice(rel+len))+(a+part.length<s.length ? '…' : '');
}

/* ---------- 자동 백업 (이 기기 안에 하루 한 번, 7일치) ---------- */
function idbOpen(){
  return new Promise((res, rej) => {
    try{
      const rq = indexedDB.open('mindmap_bk', 1);
      rq.onupgradeneeded = () => { rq.result.createObjectStore('snap', { keyPath:'day' }); };

}
async function bkAll(){ const db = await idbOpen(); return new Promise((res, rej) => { const rq = db.transaction('snap','readonly').objectStore('snap').getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error); }); }
async function bkPut(rec){ const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('snap','readwrite'); tx.objectStore('snap').put(rec); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function bkDel(day){ const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('snap','readwrite'); tx.objectStore('snap').delete(day); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function autoBackup(){
  try{
    if(typeof indexedDB==='undefined' || isBlankLocal()) return;
    const day = todayStr(), all = await bkAll();

/* ===================== 할 일 · 오늘 · 빠른 입력 (v27) ===================== */
const isDoneN = n => n.tag==='done';
const isTaskN = n => !!n.due || n.tag==='doing' || n.tag==='done';

// 하위 할 일 진행률: 각 노드의 "자손" 중 할 일(기한 있음 · 진행중 · 완료)의 개수와 완료 개수
function computeProg(m){
  const out = {}, seen = new Set();
  const walk = id => {
    const n = m.nodes[id]; if(!n || seen.has(id)) return { t:0, d:0 };
    seen.add(id);
    let t = 0, d = 0;
    for(const c of n.children){
      const r = walk(c); t += r.t; d += r.d;
      const cn = m.nodes[c];
      if(cn && isTaskN(cn)){ t++; if(isDoneN(cn)) d++; }
    }
    out[id] = { t, d };
    return { t, d };
  };
  walk(m.rootId);
  for(const id in m.nodes){ if(!seen.has(id) && !m.nodes[id].parent) walk(id); }
  return out;
}
function dueInfo(n){
  const t = todayStr(), k = dayDiff(t, n.due), done = isDoneN(n);
  const [, mo, da] = n.due.split('-');
  let label, color;
  if(done){ label = (+mo)+'/'+(+da); color = '#94a3b8'; }
  else if(k===0){ label = '오늘'; color = '#f97316'; }
  else if(k<0){ label = (-k)+'일 지남'; color = '#ef4444'; }
  else if(k<=7){ label = 'D-'+k; color = '#6366f1'; }
  else{ label = (+mo)+'/'+(+da); color = '#64748b'; }
  return { label, color, k, done };
}
function inMap(mid, fn){
  const prev = data.current;
  if(!data.maps[mid] || mid===prev) return fn();
  data.current = mid;
  try{ return fn(); }finally{ data.current = prev; render(); }
}

/* ---------- 값 · 합계 (하위 노드 값을 모아 부모에 표시) ---------- */
const AGG_LABEL = { sum:'합', avg:'평균', max:'최대', min:'최소', cnt:'개수' };
const fmtVal = v => (Math.round(v*100)/100).toLocaleString('ko-KR', { maximumFractionDigits:2 });
// 각 노드의 "하위 집계": 바로 아래 자식 중 자기 값이 있는 노드만 모은다 (한 단계만, 위로 계속 쌓이지 않음)
function computeAgg(m){
  const out = {};
  for(const id in m.nodes){
    const n = m.nodes[id], kids = n.children.map(c => m.nodes[c]).filter(c => c && c.val!=null);
    if(!kids.length) continue;
    const vs = kids.map(c => c.val), k = n.agg || 'sum', sum = vs.reduce((a, b) => a+b, 0);
    let v = k==='avg' ? sum/vs.length : k==='max' ? Math.max.apply(null, vs) : k==='min' ? Math.min.apply(null, vs) : k==='cnt' ? vs.length : sum;
    v = Math.round(v*1e6)/1e6;
    const unit = k==='cnt' ? '개' : ((kids.find(c => c.unit) || {}).unit || '');
    out[id] = { v, unit, k };
  }
  return out;
}

function pathOf(m, n, max){
  const names = []; let p = n.parent && m.nodes[n.parent], g = 0;
  while(p && g<max){ names.unshift(p.text || '…'); p = p.parent && m.nodes[p.parent]; g++; }
  return names.join(' › ');
}

      di ? h('span',{ class:'dd', style:'--c:'+di.color }, di.label) : null);
  };
  const head = (title, cnt, cls, act) => h('div',{ class:'tds'+(cls?' '+cls:'') }, h('span',{}, title), h('em',{ class:'cnt' }, String(cnt)), h('span',{ class:'sp' }), act || null);
  const more = (key, total, lim) => total>lim ? h('button',{ class:'tdmore', type:'button', onclick:() => { if(tdMore.has(key)) tdMore.delete(key); else tdMore.add(key); renderToday(); } }, tdMore.has(key) ? '접기' : '+'+(total-lim)+'개 더 보기') : null;
  const list = (key, title, items, build, cls, lim, act) => {
    if(!items.length) return;
    lim = lim || 6;
    body.append(head(title, items.length, cls, act));
    (tdMore.has(key) ? items : items.slice(0, lim)).forEach(x => body.append(build(x)));
    const mb = more(key, items.length, lim); if(mb) body.append(mb);
  };

  list('over', '기한 지남', overdue, x => taskRow(x), 'red');

  body.append(head('오늘', evsT.length + dueToday.length, ''));
  if(evsT.length){ const ag = h('div',{ class:'agenda' }); evsT.forEach(ev => ag.append(evRow(ev, t, {}))); body.append(ag); }
  dueToday.forEach(x => body.append(taskRow(x)));
  if(!evsT.length && !dueToday.length) body.append(h('p',{ class:'note tdnone' }, '오늘 일정과 기한이 없어요.'));

  if(ib || inbox.length) list('inb', '받은편지함', inbox, x => taskRow(x, { nock:false }), '', 5, h('button',{ class:'tdlink', type:'button', onclick:() => goNode(ib.mid, ib.id) }, '맵에서 정리'));

  if(evsM.length || soon.length){
    body.append(head('곧', evsM.length + soon.length, ''));
    if(evsM.length){ const ag = h('div',{ class:'agenda' }); evsM.forEach(ev => ag.append(evRow(ev, tm, { showDate:true }))); body.append(ag); }
    (tdMore.has('soon') ? soon : soon.slice(0,6)).forEach(x => body.append(taskRow(x)));
    const mb = more('soon', soon.length, 6); if(mb) body.append(mb);
  }
  list('doing', '진행 중', doing, x => taskRow(x));
  list('star', '중요 · 급함', star, x => taskRow(x));
  list('rec', '최근 본 노드', recent, x => taskRow(x, { nock:true }), '', 5);

  if(!tasks.length && !inbox.length && !evsT.length && !evsM.length && !recent.length){
    body.append(h('p',{ class:'note tdnone', style:'margin-top:22px' }, '아직 비어 있어요. 위 입력칸에 떠오른 걸 적으면 받은편지함에 모이고, 노드에 기한을 정하면 여기에 나와요.'));
  }
  body.scrollTop = keep;
}

/* ---------- 시작: 입력줄 · URL 인자(바로가기 · 공유) ---------- */
function prodInit(){
  const wrap = $('#tdQuick'); if(!wrap) return;
  const inp = h('input',{ type:'text', placeholder:'떠오른 생각 바로 적기', enterkeyhint:'done', autocomplete:'off', 'aria-label':'빠른 입력' });
  const mic = micBtn(inp);
  const send = h('button',{ type:'button', class:'qsend', title:'받은편지함에 담기', 'aria-label':'받은편지함에 담기', html:ic('send',18) });
  const go = () => {
    const lines = inp.value.split(/\n+/).map(s => s.trim()).filter(Boolean); if(!lines.length) return;
    if(addToInbox(lines.map(s => ({ text:s })))) inp.value = '';
  };
  send.addEventListener('click', go);
  send.addEventListener('mousedown', e => e.preventDefault());
  inp.addEventListener('keydown', e => { if(e.isComposing || e.keyCode===229) return; if(e.key==='Enter'){ e.preventDefault(); go(); } });
  wrap.append(inp, mic, send);
  $('#tdSearch').addEventListener('click', openSearch);
  $('#tdAddEv').addEventListener('click', () => openEventEditor(null,{ ds:todayStr() }));
  document.addEventListener('visibilitychange', () => { if(!document.hidden && !$('#pageToday').classList.contains('hidden')) renderToday(); });

  let q = null; try{ q = new URLSearchParams(location.search); }catch(e){}
  if(!q || ![...q.keys()].length) return;
  const title = (q.get('title')||'').trim(), text = (q.get('text')||'').trim(), url = (q.get('url')||'').trim();
  if(title || text || url){
    const urls = [];
    (([title, text, url].join(' ')).match(/https?:\/\/[^\s]+/g) || []).forEach(u => { const c = cleanUrl(u); if(c && !urls.includes(c)) urls.push(c); });
    const bodyT = text.replace(/https?:\/\/[^\s]+/g, '').trim();
    const lines = bodyT.split(/\n/);
    const headT = (title || lines[0] || (urls[0] || '')).slice(0,120);
    const rest = title ? bodyT : lines.slice(1).join('\n').trim();
    showTab('today');
    addToInbox([{ text:headT, memo:rest, urls }]);
  }else if(q.get('quick')==='1' || q.get('tab')==='today'){
    showTab('today');
    if(q.get('quick')==='1') setTimeout(() => { try{ inp.focus(); }catch(e){} }, 350);
  }
  try{ history.replaceState(null, '', location.pathname); }catch(e){}
}


/* 테마 */
function applyTheme(){
  const t = S().theme;
  const dark = t==='dark' || (t==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const mt = document.querySelector('meta[name=theme-color]'); if(mt) mt.content = dark ? '#16121a' : '#fff4ea';
}
if(window.matchMedia) try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); render(); }); }catch(e){}

window.addEventListener('resize', () => { if(!viewReady) ensureView(); });

/* 시작 */
initIcons();
updateLockUI();
svg.insertAdjacentHTML('afterbegin','<defs>'+SHADOW_DEFS+'</defs>');
applyTheme();
refitAll(cur());
render();
let startTab = 'map'; try{ { const v = localStorage.getItem('mm_tab'); startTab = (v==='schedule' || v==='today') ? v : 'map'; } }catch(e){}
showTab(startTab);
requestAnimationFrame(ensureView);
prodInit();
renderCal();
setTimeout(checkAlarms, 800);
setTimeout(purgeDoneEvents, 1500);
setTimeout(backupReminder, 2800);
setTimeout(autoBackup, 3000);
refreshSyncUI();
if(syncOn() && syncCfg.auto) setTimeout(() => syncNow({ silent:true }), 1600);

})();
</script>
