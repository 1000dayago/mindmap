<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#e8ecf8">
<title>마인드맵</title>
<style>
:root{
  --bg:#e8ecf8;
  --panel:rgba(255,255,255,.82);
  --panel-solid:#ffffff;
  --text:#0c1222;
  --sub:#5a647c;
  --line:rgba(100,120,180,.14);
  --accent:#3b5bff;
  --accent2:#7c3aed;
  --accent3:#06b6d4;
  --accent-soft:rgba(59,91,255,.10);
  --danger:#f43f5e;
  --canvas:#f4f6fc;
  --dot:rgba(90,110,160,.22);
  --grad:linear-gradient(135deg,#3b5bff 0%,#6366f1 40%,#8b5cf6 75%,#a78bfa 100%);
  --grad-glow:0 8px 28px rgba(59,91,255,.35),0 2px 8px rgba(124,58,237,.2);
  --good:linear-gradient(135deg,#2dd4bf,#10b981);
  --bad:linear-gradient(135deg,#fb7185,#e11d48);
  --shadow:0 20px 50px rgba(30,40,90,.12),0 4px 16px rgba(30,40,90,.06);
  --shadow-s:0 6px 18px rgba(30,40,90,.10);
  --radius:22px;--radius-s:14px;
  --blur:saturate(1.4) blur(20px);
}
:root[data-theme="dark"]{
  --bg:#07090f;
  --panel:rgba(18,22,36,.78);
  --panel-solid:#121624;
  --text:#f0f3ff;
  --sub:#8b95b5;
  --line:rgba(140,160,220,.12);
  --accent:#6b8aff;
  --accent2:#a78bfa;
  --accent3:#22d3ee;
  --accent-soft:rgba(107,138,255,.14);
  --danger:#fb7185;
  --canvas:#05070c;
  --dot:rgba(100,120,180,.18);
  --grad:linear-gradient(135deg,#4f6fff 0%,#7c6bff 45%,#a78bfa 100%);
  --grad-glow:0 8px 32px rgba(79,111,255,.4),0 2px 10px rgba(167,139,250,.25);
  --shadow:0 20px 50px rgba(0,0,0,.55),0 4px 16px rgba(0,0,0,.3);
  --shadow-s:0 6px 18px rgba(0,0,0,.4);
  --radius:22px;--radius-s:14px;
  --blur:saturate(1.3) blur(22px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:15px;letter-spacing:-.02em;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(59,91,255,.12), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(139,92,246,.10), transparent 50%),
    radial-gradient(800px 400px at 80% 100%, rgba(6,182,212,.08), transparent 50%);
}
#app{position:relative;z-index:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.hidden{display:none!important}
.svgi{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
[data-ic]{display:inline-flex;align-items:center;justify-content:center}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1}
.page{flex:1;min-height:0;display:flex;flex-direction:column}

/* tabs */
#tabs{display:flex;gap:10px;padding:12px 16px 10px;background:transparent;order:-1;flex:none;justify-content:center}
#tabs button{display:flex;align-items:center;gap:9px;padding:11px 22px;border-radius:999px;color:var(--sub);font-weight:700;font-size:14px;transition:all .2s cubic-bezier(.2,.8,.2,1);background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:var(--shadow-s)}
#tabs button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--grad-glow);transform:translateY(-1px)}
#tabs button:not(.on):active{transform:scale(.97)}

/* topbar */
#topbar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:var(--radius) var(--radius) 0 0;flex:none;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
#topbar .sp{flex:1}
.namebtn{max-width:52%;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:800;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);letter-spacing:-.02em;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}
.namebtn #mapNameText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.namebtn [data-ic]:first-child{color:var(--accent)}
.namebtn [data-ic]:last-child{color:var(--sub)}
.ibtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--text);transition:all .15s;border:1px solid transparent}
.ibtn:hover:not(:disabled){background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 15%,transparent)}
.ibtn:active:not(:disabled){transform:scale(.92)}
.ibtn:disabled{opacity:.28;cursor:default}
#undo,#redo{color:var(--accent)}
#moreMenu{background:var(--grad);color:#fff;box-shadow:var(--grad-glow);border:none}

/* toolbar */
#toolbar{display:flex;gap:6px;padding:10px 12px;background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;align-items:center}
#toolbar button{display:flex;flex-direction:row;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:999px;white-space:nowrap;font-size:13px;font-weight:700;flex:none;transition:all .18s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line);background:color-mix(in srgb,var(--panel-solid) 70%,transparent)}
#toolbar button [data-ic]{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--c,#3b5bff) 16%,transparent);color:var(--c,#3b5bff);box-shadow:0 0 12px color-mix(in srgb,var(--c,#3b5bff) 12%,transparent)}
#toolbar button:hover:not(:disabled){background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 22%,transparent);transform:translateY(-1px)}
#toolbar button:active:not(:disabled){transform:scale(.96)}
#toolbar button:disabled{opacity:.3;cursor:default}
#toolbar .vsep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}

/* 빠른 노드 서식 */
#quickStyle{display:flex;align-items:center;gap:7px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);min-height:46px;overflow-x:auto;flex:none;scrollbar-width:thin}
#quickStyle.hidden{display:none!important}
#quickStyle .qs-title{font-size:11px;color:var(--sub);font-weight:800;white-space:nowrap}
#quickStyle .qs-sep{width:1px;height:25px;background:var(--line);flex:none}
#quickStyle .qs-shape{height:30px;min-width:34px;padding:0 7px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:12px;font-weight:800;white-space:nowrap}
#quickStyle .qs-shape{display:flex;align-items:center;justify-content:center;flex:none} #quickStyle .qs-shape svg{display:block;overflow:visible} #quickStyle .qs-shape.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#quickStyle .qs-color{width:25px;height:25px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px #0002;flex:none}
#quickStyle .qs-color.on{outline:2px solid var(--text);outline-offset:2px}
#quickStyle .qs-tree{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:11px;font-weight:700;color:var(--sub)}
#quickStyle .qs-tree input{accent-color:var(--accent);width:16px;height:16px}
@media(max-width:820px){#quickStyle{min-height:42px;padding:5px 7px;gap:6px}#quickStyle .qs-title{display:none}#quickStyle .qs-shape{height:28px;min-width:32px;padding:0 5px;font-size:11px}#quickStyle .qs-color{width:23px;height:23px}}
/* stage */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background-color:var(--canvas);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% 0%, color-mix(in srgb,var(--accent) 6%,transparent), transparent),
    radial-gradient(var(--dot) 1.2px,transparent 1.35px);
  background-size:auto, 24px 24px}
#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#hint{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);color:var(--sub);font-size:13px;text-align:center;pointer-events:none;width:80%;font-weight:600;letter-spacing:-.01em}
#zoomctl{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:999px;box-shadow:var(--shadow-s);overflow:hidden;z-index:4;padding:4px;border:1px solid var(--line)}
#zoomctl button{width:26px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--accent);border-radius:999px}
#zoomctl button:active{background:var(--accent-soft)}
#zoomctl #zlabel{font-size:10px;font-weight:800;color:var(--sub)}

/* pills (노드 컨트롤 / 연관선 컨트롤) */
#nodectl{position:absolute;inset:0;pointer-events:none;z-index:5}
.pill{position:absolute;display:flex;gap:4px;padding:4px;background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:999px;box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.25) inset;pointer-events:auto;z-index:5;border:1px solid color-mix(in srgb,var(--accent) 18%,var(--line))}
.pill button{position:relative;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);background:var(--accent-soft);transition:transform .12s}
.pill button:active{transform:scale(.9)}
.pill button::after{content:"";position:absolute;inset:-6px}
.pill button.add{background:var(--good);color:#fff;box-shadow:0 2px 10px rgba(16,185,129,.4)}
.pill button.rm{background:var(--bad);color:#fff;box-shadow:0 2px 10px rgba(244,63,94,.35)}
.pill button:disabled{opacity:.3;cursor:default}
#ctlX{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--bad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-s);pointer-events:auto}
#ctlX::after{content:"";position:absolute;inset:-7px}
#linkctl{gap:3px}
#linkctl button{width:26px;height:26px}
#ctlDown [data-c=style]{width:20px;height:20px;border-radius:50%;background:#8b5cf6;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
#ctlDown [data-c=style].active{background:#6d28d9;color:#fff}
#ctlDown [data-c=style]::after{inset:-6px}
#nodeStylePop{position:absolute;z-index:9;width:min(300px,calc(100% - 20px));max-height:min(330px,60%);overflow:auto;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);pointer-events:auto}
#nodeStylePop.hidden{display:none!important}
#nodeStylePop .nsp-title{font-size:11px;font-weight:800;color:var(--sub);margin:2px 0 7px}
#nodeStylePop .nsp-shapes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
#nodeStylePop .nsp-shape{min-height:34px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:11px;padding:4px 2px}
#nodeStylePop .nsp-shape{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px} #nodeStylePop .nsp-shape svg{display:block} #nodeStylePop .nsp-shape small{font-size:10px} #nodeStylePop .nsp-shape.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:800}
#nodeStylePop .nsp-colors{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:4px 3px 8px}
#nodeStylePop .nsp-color{width:27px;height:27px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px #0002;justify-self:center}
#nodeStylePop .nsp-color.on{outline:2px solid var(--text);outline-offset:2px}
#nodeStylePop .nsp-foot{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
#nodeStylePop .nsp-foot button{font-size:12px;padding:6px 10px;border-radius:9px;background:var(--bg)}

/* 모드 바 */
#modebar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:8px;background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:999px;padding:7px 7px 7px 18px;box-shadow:var(--shadow);font-size:13px;font-weight:700;max-width:94%;border:1px solid var(--line)}
#modebar .mb{padding:8px 16px;border-radius:999px;background:var(--bg);font-weight:700;font-size:13px;white-space:nowrap}
#modebar .mb.ok{background:var(--grad);color:#fff;box-shadow:var(--grad-glow)}

/* 노드 상세 패널 */
#npanel{position:absolute;z-index:8;top:10px;right:10px;bottom:10px;width:min(360px,calc(100% - 20px));background:var(--panel);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:26px;box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.35) inset;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.np-head{display:flex;align-items:center;gap:8px;padding:12px 10px 2px 18px}
.np-title{flex:1;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-tabs{display:flex;gap:3px;margin:8px 12px 4px;padding:4px;background:var(--bg);border-radius:999px;border:1px solid var(--line)}
.np-tabs button{flex:1;padding:9px 2px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--sub);display:flex;gap:4px;align-items:center;justify-content:center;white-space:nowrap;transition:all .15s}
.np-tabs button.on{background:var(--panel-solid);color:var(--accent);box-shadow:var(--shadow-s)}
.np-body{flex:1;min-height:0;overflow:auto;padding:8px 14px 12px}
.np-foot{flex:none;display:flex;gap:10px;padding:12px 14px max(14px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,var(--bg)),var(--panel))}
.np-foot .btn{flex:1;justify-content:center;display:flex;align-items:center;font-size:15px}
.np-foot .btn.primary{flex:1.5;font-weight:800;box-shadow:var(--grad-glow)}
.prog{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:4px 0 8px}
.prog>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .2s}
.ckrow{display:flex;align-items:flex-start;gap:6px;padding:3px 0}
.ckrow .box{width:24px;height:24px;border-radius:9px;border:2px solid var(--line);flex:none;margin-top:7px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--panel)}
.ckrow.done .box{background:var(--good);border-color:transparent}
.ckrow textarea{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--text);padding:8px 6px;outline:none;border-radius:12px;resize:none;overflow:hidden;line-height:1.35}
.ckrow textarea:focus{background:var(--bg)}
.ckrow.done textarea{text-decoration:line-through;color:var(--sub)}
.mini{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none;margin-top:7px}
.mini:hover{background:var(--accent-soft);color:var(--accent)}
.mini.d:hover{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.lkrow{display:flex;align-items:center;gap:6px;padding:4px 0}
.lkrow a{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--bg);color:var(--text);text-decoration:none}
.lkrow a .ico{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,#0ea5e9 16%,transparent);color:#0ea5e9;display:flex;align-items:center;justify-content:center;flex:none}
.lkrow a b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lkrow a small{display:block;color:var(--sub);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lkrow .mini{margin-top:0}
.addbar{display:flex;gap:6px;margin-top:10px;align-items:flex-end}
.addbar .field{flex:1}
.micbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,#ef4444 14%,transparent);color:#ef4444;flex:none}
.micbtn.on{background:#ef4444;color:#fff;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 12px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.tt-icons{display:inline-flex;gap:6px;margin-left:10px;vertical-align:middle}
.tt-ic{height:30px;min-width:30px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:4px;background:var(--bg);color:var(--c);font-size:11px;font-weight:800;opacity:.6}
.tt-ic.has{background:color-mix(in srgb,var(--c) 16%,transparent);opacity:1}
.tt-ic em{font-style:normal}
.stat{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--sub);font-weight:700}

/* schedule placeholder */

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center}
#sheetBackdrop{position:absolute;inset:0;background:rgba(10,15,30,.45);backdrop-filter:blur(2px)}
#sheet{position:relative;width:min(460px,94vw);height:var(--sheet-height, auto);max-height:var(--sheet-max-height,84vh);max-height:var(--sheet-max-height,84dvh);overflow:hidden;display:flex;flex-direction:column;background:var(--panel-solid);border-radius:28px;box-shadow:var(--shadow),0 0 60px rgba(59,91,255,.08);padding:8px 18px 20px;border:1px solid var(--line)} #sheetTitle{flex:none} #sheetBody{min-height:0;overflow:auto;overscroll-behavior:contain;flex:1;display:flex;flex-direction:column} .sheet-grip{width:100%;height:24px;min-height:24px;border-radius:12px;background:transparent;margin:2px auto 6px;touch-action:none;cursor:ns-resize;flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:8}
.sheet-grip::before{content:'';display:block;width:36px;height:4px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.45} .sheet-zoom-hint{font-size:11px;color:var(--sub);margin:0 0 5px}
#sheet h3{margin:12px 0 12px;font-size:18px;font-weight:800;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.note{margin:0 0 10px;color:var(--sub);font-size:13px;line-height:1.5}
.list{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;text-align:left;width:100%;min-height:54px;transition:background .14s,transform .12s;border:1px solid transparent}
.item:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 12%,transparent)}
.item:active{background:color-mix(in srgb,var(--accent-soft) 80%,var(--accent) 8%);transform:scale(.99)}
.item .ico{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));box-shadow:0 0 16px color-mix(in srgb,var(--c,var(--accent)) 10%,transparent)}
.item .t{flex:1}
.item .s{color:var(--sub);font-size:12px}
.item .chk{color:var(--accent);font-weight:800}
.item.danger{color:var(--danger)}
.item.toggle{padding:10px 12px}
.item.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.field{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,var(--panel-solid));color:var(--text);resize:vertical;outline:none;transition:border-color .15s,box-shadow .18s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent),0 0 24px color-mix(in srgb,var(--accent) 10%,transparent)}
.row{display:flex;gap:8px;margin-top:12px}
.row.end{justify-content:flex-end}
.btn{padding:12px 22px;border-radius:999px;background:var(--bg);font-weight:700;min-height:48px;letter-spacing:-.015em;transition:transform .14s cubic-bezier(.2,.8,.2,1),box-shadow .18s;border:1px solid var(--line)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);color:#fff;border:none;box-shadow:var(--grad-glow)}
.btn.primary:active{box-shadow:0 4px 14px rgba(59,91,255,.3)}
.seg{display:flex;gap:4px;margin:6px 0 10px;padding:4px;background:var(--bg);border-radius:999px}
.seg button{flex:1;padding:10px 4px;border-radius:999px;font-size:13px;min-height:42px;font-weight:700;color:var(--sub);transition:all .15s}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:var(--shadow-s);font-weight:800}
.seg button:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.grid.sw{grid-template-columns:repeat(6,1fr)}

/* 일정(달력) */

#calTop .sp{flex:1}
#calSeg{margin:6px 12px 6px;flex:none}

.cm{display:flex;flex-direction:column;gap:12px}

.cdow{text-align:center;font-size:12px;font-weight:800;color:var(--sub);padding:4px 0}
.sun{color:#ef4444!important}.sat{color:#3b82f6!important}
.cday{min-height:58px;border-radius:14px;padding:4px 3px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden;border:2px solid transparent}

.cday.sel{border-color:var(--accent);background:var(--accent-soft)}
.cday .dn{font-size:13px;font-weight:700;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cday.today .dn{background:var(--grad);color:#fff!important}
.cchips{display:none;width:100%;flex-direction:column;gap:2px}
.cchip{display:block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:7px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.cmore{font-size:10px;color:var(--sub);font-weight:700;text-align:left}
.cdots{display:flex;gap:3px;min-height:6px}
.cdots i{width:6px;height:6px;border-radius:50%}
.agenda{display:flex;flex-direction:column;gap:6px;min-width:0}
.ahead{display:flex;align-items:center;justify-content:space-between;padding:2px 4px;font-size:15px}
.evrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--bg);border-left:5px solid var(--c,var(--accent));cursor:pointer;text-align:left;width:100%}
.evrow:hover{background:var(--accent-soft)}
.evrow .tm{font-size:12px;font-weight:800;color:var(--c,var(--accent));min-width:50px;flex:none}
.evrow .tt{flex:1;min-width:0}
.evrow .tt b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evrow .tt small{display:block;color:var(--sub);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evrow .tgs{display:flex;gap:4px;color:var(--sub)}
.evrow .tg.mm{color:var(--accent)}
.cwk{display:grid;grid-template-columns:1fr;gap:8px}
.wkd{background:var(--bg);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wkd.today{outline:2px solid var(--accent)}
.wkh{font-weight:800;font-size:13px;text-align:left;padding:2px 4px}
.wke{color:var(--sub);padding:0 4px}
.wkd .evrow{background:var(--panel);padding:8px 10px}

.cdy{display:flex;flex-direction:column;gap:8px;max-width:720px;margin:0 auto}
.cyr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ym{background:var(--bg);border-radius:18px;padding:10px}
.ym .mh{font-weight:800;font-size:14px;padding:2px 4px 6px}
.yg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.yw{font-size:9px;color:var(--sub);text-align:center}
.yd{aspect-ratio:1;font-size:10.5px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text)}
.yd.has{background:var(--accent);color:#fff;font-weight:800}
.yd.today{outline:2px solid #f97316;outline-offset:-1px}
.frow{display:flex;gap:8px;align-items:flex-end;margin:8px 0}
.mmbox{margin-top:10px;padding:10px 12px;border-radius:18px;background:var(--accent-soft)}
.mmbox .lbl{margin-top:0}
input[type=date].field,input[type=time].field{min-height:46px}
/* 표 */
.tbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tbtn{padding:6px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12.5px}

.tblwrap{overflow:auto;border-radius:16px;background:var(--bg);max-height:50vh;max-height:50dvh}
table.sheet{border-collapse:separate;border-spacing:0;font-size:14px}

table.sheet tbody th{left:0;z-index:2}
table.sheet td{padding:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
table.sheet input{width:96px;border:0;background:var(--panel);padding:10px 8px;font:inherit;font-size:16px;color:var(--text);outline:none;border-radius:0}

table.sheet input:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft);color:var(--text);text-align:left}
table.sheet td.active{outline:2px solid var(--accent);outline-offset:-2px;position:relative;z-index:1;background:var(--accent-soft)}
table.sheet input[readonly]{cursor:pointer;caret-color:transparent}

}

/* ===================== v25 : A+ 테마 (따뜻한 잉크 × 선라이즈) ===================== */
:root{

.nbfly .ssep{width:1px;height:18px;background:var(--line);margin:3px 1px;flex:none}
@media(max-width:820px){
  .nbb{width:26px;height:26px}
  .nbb::after{inset:-5px}
  #nbPlus{width:22px;height:22px;margin:-11px 0 0 -11px}
  #nbPlus::after{inset:-5px}
  .nbf{min-width:30px} .nbf .g{width:27px;height:27px}
  .nbf.sq{width:44px;height:32px}
}

/* 연속 입력 막대 · 휴지통 영역 */
#inlBar{position:absolute;z-index:7;display:flex;gap:4px;padding:3px;background:var(--panel-solid);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-s)}
#inlBar button{display:flex;align-items:center;gap:4px;padding:5px 11px 5px 8px;border-radius:999px;font-size:11.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border:0}
#inlBar button:last-child{background:var(--grad);color:#fff}
#inlBar i{font-style:normal}
#trashZone{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--panel-solid);border:2px dashed var(--bad);color:var(--bad);font-size:12px;font-weight:800;box-shadow:var(--shadow-s);pointer-events:none;transition:transform .12s,background .12s}
#trashZone.hot{background:var(--bad);color:#fff;transform:translateX(-50%) scale(1.08)}

.inl.dock{text-align:left;border-radius:14px;padding:10px 12px;font-weight:600;box-shadow:0 -4px 22px rgba(90,50,20,.28);z-index:8}
.inl.dock::placeholder{color:#aaa}
#inlBar .micbtn{width:26px;height:26px;flex:0 0 auto;padding:0}
#inlBar .micbtn svg{width:15px;height:15px}
@media (max-width:820px){#inlBar .micbtn{width:32px;height:32px}#inlBar .micbtn svg{width:17px;height:17px}}
#dragGuide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:hidden}
#dragGuide line{stroke:var(--accent);stroke-opacity:.22;stroke-width:1.2;stroke-dasharray:4 5}
#dragGuide line.on{stroke-opacity:.8;stroke-width:2;stroke-dasharray:none}
#inlBar button[data-k=nl]{display:none}
@media (max-width:820px){#inlBar button[data-k=nl]{display:flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0}}

#inlBar button[data-k=child],#inlBar button[data-k=sibling]{justify-content:center;width:26px;height:26px;padding:0}
@media (max-width:820px){#inlBar button[data-k=child],#inlBar button[data-k=sibling]{width:32px;height:32px}}

/* 링크 탭: 파일 종류 배지 · 경로 행 */
.lkk{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:22px;padding:0 6px;border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.2px;color:#fff;background:var(--c,#64748b);flex:none}
.lkrow .lka{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:var(--bg);color:var(--text)}
.lkrow .lka b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lkrow .lka small{display:block;color:var(--sub);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 메모 서식 편집기 */
.mtb{display:flex;flex-wrap:wrap;align-items:center;gap:2px 2px;position:sticky;top:0;z-index:3;background:var(--panel-solid,var(--bg));padding:2px 0 6px}
.mtb .sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.mtbtn{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);flex:none;font-size:15px}
.mtbtn:active{background:color-mix(in srgb,var(--accent,#5b6cff) 16%,transparent)}
.mtbtn.ok{color:var(--accent,#5b6cff)}
.mtbtn .dot{width:17px;height:17px;border-radius:50%;display:block}
.mtbtn .hlp{background:#fde68a;color:#1f2937;border-radius:5px;padding:0 4px;font-weight:800;font-size:14px}
.mtb .micbtn{width:34px;height:34px;background:none;color:#ef4444}
.mtb .micbtn.on{background:#ef4444;color:#fff}
.mtb .micbtn svg{width:18px;height:18px}
.mpop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 2px 8px}
.mpop.hidden{display:none}
.mpop .sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.mpop .sw.none{background:linear-gradient(135deg,transparent 46%,#ef4444 46%,#ef4444 54%,transparent 54%),var(--bg)}
.mpop .sz{width:40px;height:34px}
.field.memoed{min-height:200px;resize:none;overflow:auto;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text;-webkit-user-modify:read-write;cursor:text}
.memoed:empty::before{content:attr(data-ph);color:var(--sub);pointer-events:none}
.memoed ul,.memoed ol{margin:2px 0;padding-left:1.5em}
.memoed ul.dash{list-style:none;padding-left:1.4em}
.memoed ul.dash>li::marker{content:'—  '}
.memoed a{color:#2563eb;text-decoration:underline}
.memoed .mck{display:inline-block;font-size:1.1em;line-height:1;cursor:pointer;user-select:none;-webkit-user-select:none}
.memoed .mck.on{color:#16a34a}

/* 달력: 휴일 · 주 번호 */
.cgrid.wk{grid-template-columns:20px repeat(7,minmax(0,1fr))}
.cwn{display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-size:10px;font-weight:700;color:var(--sub);opacity:.75}
.cdow.cwn0{font-size:10px;opacity:.7}
.cday .hn{font-size:9.5px;line-height:1.1;font-weight:700;color:#ef4444;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:stretch;text-align:center}
.cday .dn.sun{color:#ef4444}
.yd.hol{color:#ef4444;font-weight:800}
.yd.has.hol{color:#fff}
.wkh.sun{color:#ef4444}

/* 모바일: 하단 탭 · 도구줄 높이 줄이기 (글자 빼고 아이콘만) */
@media (max-width:820px){
  #tabs{padding:3px 12px calc(3px + env(safe-area-inset-bottom))}
  #tabs button{min-height:36px;padding:2px 0;gap:0}
  #tabs button > span:not(.ti){display:none}
  #tabs button .ti{width:52px;height:30px}
  #tabs button .ti svg{width:19px;height:19px}
  #toolbar{padding:5px 10px;gap:6px}
  #toolbar button{min-width:44px;min-height:44px;padding:4px;border-radius:14px;gap:0}
  #toolbar button .lb{display:none}
  #toolbar button [data-ic]{width:32px;height:32px}
}

/* 메모 서식 줄: 작게 */
.mtb{gap:0 1px;padding:0 0 4px}
.mtb .sep{height:14px;margin:0 3px}
.mtbtn{width:27px;height:27px;border-radius:8px;font-size:13px}
.mtbtn .dot{width:14px;height:14px}
.mtbtn .hlp{font-size:12px;padding:0 3px;border-radius:4px}
.mtb .micbtn{width:27px;height:27px}
.mtb .micbtn svg{width:15px;height:15px}
.mpop{gap:5px;padding:2px 2px 6px}
.mpop .sw{width:22px;height:22px}
.mpop .sz{width:30px;height:27px}
.field.memoed{font-size:15px;padding:12px 14px;min-height:160px}
/* 키보드로 화면이 줄어도 작업창이 위로 잘리지 않게 */
@media (max-width:820px){
  #npanel:not(.kb-open){max-height:100%}
}

/* 표: 드롭다운 도구 줄 · 셀 서식 창 */
.sbtn.dd{gap:3px;padding:0 6px 0 8px}
.sbtn .car{width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4.5px solid currentColor;margin-left:2px;opacity:.75;display:inline-block}
.fcA{font-weight:900;font-size:13px;border-bottom:3px solid #dc2626;line-height:1;padding:0 1px}
.shmenu{overflow-y:auto}
.shmenu button{white-space:pre}
.shpop{flex-wrap:wrap;max-width:250px}
.fdtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.fdtabs button{flex:1;padding:8px 6px;font-size:13px;font-weight:700;color:var(--sub);border-bottom:2px solid transparent;white-space:nowrap}
.fdtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.fdpane{min-height:150px}
.fdrow{display:flex;gap:6px;flex-wrap:wrap}
.fdopt{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600;color:var(--text)}
.fdopt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fdopt.d{color:var(--danger)}
.fdopt.dim{opacity:.45}
.fdopt.fb{font-weight:900}.fdopt.fi{font-style:italic}.fdopt.fu{text-decoration:underline}.fdopt.fs{text-decoration:line-through}
.fdgrid1{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fdopt.wide{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.fdopt.wide small{opacity:.75;font-size:11.5px}
.fdsws{display:flex;gap:7px;flex-wrap:wrap}
.fdsw{width:30px;height:30px;border-radius:8px;box-shadow:inset 0 0 0 1px #0003}
.fdsw.on{outline:3px solid var(--accent);outline-offset:1px}
.fdsw.none{background:var(--bg);color:var(--sub);font-weight:800;box-shadow:inset 0 0 0 1px var(--line)}

/* 표: 두 손가락 확대·축소를 브라우저가 가로채지 않게 */
.tblwrap{touch-action:pan-x pan-y}
table.sheet th{font-size:var(--thfs,11.5px)}


/* ===== v27: 오늘 화면 · 기한 · 받은편지함 ===== */
#pageToday{background:var(--panel);border-radius:22px 22px 0 0;position:relative;overflow:hidden}
#tdTop{display:flex;align-items:center;gap:2px;padding:12px 12px 0 16px;flex:none}
#tdTop .tdd{display:flex;flex-direction:column;min-width:0}
#tdTop .tdd b{font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
#tdTop .tdd small{color:var(--sub);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tdTop .sp{flex:1}
#tdQuick{display:flex;align-items:center;gap:6px;margin:10px 12px 2px;padding:4px 5px 4px 16px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);flex:none;transition:border-color .15s,box-shadow .18s}
#tdQuick:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
#tdQuick input{flex:1;min-width:0;font:inherit;font-size:16px;background:transparent;border:0;outline:0;color:var(--text);padding:9px 0}
#tdQuick .micbtn,#tdQuick .qsend{width:38px;height:38px;min-height:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
#tdQuick .qsend{background:var(--grad);color:#fff;box-shadow:var(--grad-glow)}
#tdQuick .qsend:active{transform:scale(.92)}
#tdBody{flex:1;min-height:0;overflow:auto;padding:2px 12px 28px;overscroll-behavior:contain}
.tds{display:flex;align-items:center;gap:8px;margin:16px 4px 6px;font-size:12.5px;font-weight:800;color:var(--sub);letter-spacing:-.01em}
.tds .cnt{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tds.red{color:#ef4444}
.tds.red .cnt{background:color-mix(in srgb,#ef4444 14%,transparent);color:#ef4444}
.tds .sp{flex:1}
.tdlink{font-size:12px;font-weight:800;color:var(--accent);padding:4px 8px;border-radius:999px}
.tdlink:hover{background:var(--accent-soft)}
.tdmore{display:block;margin:2px auto 4px;font-size:12px;font-weight:800;color:var(--sub);padding:6px 14px;border-radius:999px;background:var(--bg)}
.tdnone{margin:2px 6px 0;font-size:12.5px}
.trow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--bg);margin-bottom:5px;cursor:pointer;min-height:48px;text-align:left}
.trow:hover{background:var(--accent-soft)}
.trow:active{transform:scale(.99)}
.trow .ck{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--sub) 55%,transparent);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:transparent;padding:0}
.trow .ck:hover{border-color:#10b981}
.trow.done .ck{background:#10b981;border-color:#10b981}
.trow .tnd{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.trow .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.trow .tt b{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tt small{font-size:11.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.done .tt b{text-decoration:line-through;opacity:.55}
.trow .dd{flex:none;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
#pageToday .agenda{margin-bottom:5px}


/* ===== 기간 일정 막대 ===== */
.cgrid.wk{--bh:16px;--bs:18px}
.cspc{align-self:stretch;flex:none;height:calc(14px + var(--bs)*var(--n))}
.cspc .hn{display:block}
.cbar{align-self:start;height:var(--bh);margin:0 3px;background:var(--c);color:var(--tc,#fff);font-size:10px;font-weight:700;line-height:var(--bh);padding:0 6px;border-radius:7px;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:2;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cbar span{display:block;overflow:hidden;text-overflow:ellipsis}
.cbar.l{margin-left:0;padding-left:10px;border-top-left-radius:0;border-bottom-left-radius:0;clip-path:polygon(6px 0,100% 0,100% 100%,6px 100%,0 50%)}
.cbar.r{margin-right:0;padding-right:10px;border-top-right-radius:0;border-bottom-right-radius:0;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 50%,calc(100% - 6px) 100%,0 100%)}
.cbar.l.r{clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 50%,calc(100% - 6px) 100%,6px 100%,0 50%)}
.cbar:active{filter:brightness(.92)}
.wkspan{--bh:19px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:3px;row-gap:3px;margin-bottom:8px;padding:6px 4px;background:var(--bg);border-radius:16px}
.wkspan .cbar{font-size:11px}
.wsh{font-size:11px;font-weight:800;text-align:center;padding:2px 0;color:var(--sub)}
.wsh.today{color:var(--accent)}
@media (min-width:821px){
  .cgrid.wk{--bh:17px;--bs:19px}
  .cbar{font-size:11px}
  .wkspan{column-gap:8px;padding:0;background:transparent}
  .wkspan .wsh{display:none}
}

.cbar.one{border-radius:6px}
.cday .cmore{align-self:flex-start;font-size:10px;font-weight:800;color:var(--sub);padding-left:3px;line-height:1.2}
.cbar.gray{box-shadow:none}
.cbar.gray span{text-decoration:line-through;opacity:.92}
.cbar{position:relative}
.cbar .rz{position:absolute;top:0;bottom:0;width:11px;cursor:ew-resize;touch-action:none;z-index:3}
.cbar .rz.s{left:0}.cbar .rz.e{right:0}
.cbar .rz::before{content:'';position:absolute;top:4px;bottom:4px;width:2px;border-radius:2px;background:rgba(255,255,255,.8)}
.cbar .rz.s::before{left:3px}.cbar .rz.e::before{right:3px}
.dragshield{position:fixed;inset:0;z-index:9998;touch-action:none;cursor:ew-resize}
.dragtip{position:fixed;z-index:9999;pointer-events:none;background:rgba(12,18,34,.92);color:#fff;font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap}


/* ===== 일정 완료 체크 ===== */
.evck{width:26px;height:26px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--text) 50%,transparent);background:var(--panel-solid,#fff);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.evck:hover{border-color:#10b981}
.evck.on{background:#10b981;border-color:#10b981}
.evrow.done{opacity:.72}
.evrow.done .tt b{text-decoration:line-through;opacity:.6}
.evrow .dnl{color:#10b981;font-weight:800;display:block;font-size:11.5px}
.trow .ck{width:26px;height:26px;border:2.5px solid color-mix(in srgb,var(--text) 50%,transparent);background:var(--panel-solid,#fff)}
.trow.done .ck{background:#10b981;border-color:#10b981}

.ordtg{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--sub)}
.ordtg.on{background:var(--accent-soft);color:var(--accent)}
.ahead .hbtns{display:flex;align-items:center;gap:4px}
.ordbs{display:flex;flex-direction:column;gap:2px;flex:none}
.ordb{width:30px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--accent);padding:0}
.ordb svg{transform:rotate(var(--r,0deg))}
.ordb:disabled{opacity:.25}
.ordb:active:not(:disabled){transform:scale(.92)}
.cdy .ordrow{display:flex;justify-content:flex-end;margin-bottom:4px}

</style>
</head>
<body>
<div id="app">
  <nav id="tabs">
    <button data-tab="today"><span class="ti" data-ic="today" data-sz="21"></span><span>오늘</span></button>
    <button data-tab="schedule"><span class="ti" data-ic="calendar" data-sz="21"></span><span>일정</span></button>
    <button data-tab="map" class="on"><span class="ti" data-ic="mindmap" data-sz="21"></span><span>마인드맵</span></button>
  </nav>

  <main id="pageToday" class="page hidden">
    <header id="tdTop">
      <div class="tdd"><b id="tdDate"></b><small id="tdSub"></small></div>
      <span class="sp"></span>
      <button class="ibtn" id="tdSearch" data-ic="zoom" data-sz="20" title="검색"></button>
      <button class="ibtn" id="tdAddEv" data-ic="plus" data-sz="20" title="일정 추가"></button>
    </header>
    <div id="tdQuick"></div>
    <div id="tdBody"></div>
  </main>

  <main id="pageSchedule" class="page hidden">
    <header id="calTop">
      <button class="chipbtn" id="calToday">오늘</button>
      <button class="ibtn" id="calPrev" data-ic="chevL" data-sz="20" title="이전"></button>
      <button class="ibtn" id="calNext" data-ic="chevR" data-sz="20" title="다음"></button>
      <button id="calTitle" class="caltitle" title="날짜로 이동"></button>
      <span class="sp"></span>
      <button class="ibtn" id="calSearchBtn" data-ic="zoom" data-sz="20" title="일정 검색"></button>
      <button class="ibtn" id="calCloud" data-ic="cloud" data-sz="20" title="동기화 · 구글 연동"></button>
    </header>
    <div id="calSeg" class="seg"><button data-v="year">년</button><button data-v="month">월</button><button data-v="week">주</button><button data-v="day">일</button><button data-v="done">완료</button></div>
    <div id="calSearchBar" class="hidden"><input id="calQ" class="field" type="search" placeholder="일정 검색 (제목 · 내용)"></div>
    <div id="calBody"></div>
    <button id="calAdd" class="fab" data-ic="plus" data-sz="26" title="일정 추가"></button>
  </main>

  <main id="pageMap" class="page">
    <header id="topbar">
      <button id="mapName" class="namebtn"><span data-ic="folder" data-sz="18"></span><span id="mapNameText">내 마인드맵</span><span data-ic="chev" data-sz="16"></span></button>
      <span class="sp"></span>
      <button class="ibtn" id="searchBtn" data-ic="zoom" title="검색 (Ctrl+F)"></button>
      <button class="ibtn" id="lockBtn" data-ic="unlock" title="편집 잠금"></button>
      <button class="ibtn" id="undo" data-ic="undo" title="되돌리기 (Ctrl+Z)"></button>
      <button class="ibtn" id="redo" data-ic="redo" title="다시 실행 (Ctrl+Shift+Z)"></button>
      <button class="ibtn" id="fitAll" data-ic="fit" title="맵 전체 보기"></button>
      <button class="ibtn" id="viewMenu" data-ic="scan" title="보기"></button>
      <button class="ibtn" id="moreMenu" data-ic="more" title="메뉴"></button>
    </header>

    <div id="toolbar" class="nosel">
      <button data-act="edit" style="--c:#f59e0b" title="편집 (F2)"><span data-ic="edit" data-sz="17"></span><span class="lb">편집</span></button>

    if(para===''){ lines.push(''); continue; }
    let line = '';
    for(const tok of para.split(' ')){
      const test = line ? line+' '+tok : tok;
      if(textW(test,fs,bold) <= maxW){ line = test; continue; }
      if(line) lines.push(line);
      line = '';
      if(textW(tok,fs,bold) <= maxW){ line = tok; }

    cur_ = p; steps++;

/* 노드 중심에서 (ux,uy) 방향으로 나간 선이 노드 테두리와 만나는 거리 */
function edgeReach(n, ux, uy){
  const a = Math.max(n.w / 2, 1), b = Math.max(n.h / 2, 1), ax = Math.abs(ux), ay = Math.abs(uy);
  if(n.shape === 'ellipse') return 1 / Math.sqrt((ux / a) * (ux / a) + (uy / b) * (uy / b));
  if(n.shape === 'diamond') return 1 / (ax / a + ay / b);
  return Math.min(ax > 1e-6 ? a / ax : 1e9, ay > 1e-6 ? b / ay : 1e9);
}
function edgeSvg(p, n, dark, focusSet, opt){
  const cc = nodeColors(n, dark);
  const isYN = S().yesNoColor && (n.kind==='yes' || n.kind==='no');
  const col = isYN ? (n.kind==='yes' ? YES_C : NO_C) : cc.base;
  const dx = n.x-p.x, dy = n.y-p.y, adx = Math.abs(dx), ady = Math.abs(dy);
  let x1,y1,x2,y2, sx0 = 0, sy0 = 0, style = 'h';     // sx0,sy0 = 부모에서 자식 쪽으로 나가는 방향
  const diag = adx > 1 && ady > 1 && ady/adx > .6 && ady/adx < 1.67;   // 대각선(약 31°~59°)
  if(diag){
    // 대각선: 두 노드의 중심을 잇는 방향 그대로, 부모 테두리 → 자식 테두리 직선
    const L = Math.hypot(dx, dy); sx0 = dx / L; sy0 = dy / L; style = 'd';
    const t1 = edgeReach(p, sx0, sy0), t2 = edgeReach(n, sx0, sy0);
    x1 = p.x + sx0*t1; y1 = p.y + sy0*t1; x2 = n.x - sx0*t2; y2 = n.y - sy0*t2;
  }else if(ady > adx){
    const sy = dy>=0 ? 1 : -1; sy0 = sy; style = 'v';
    x1 = p.x; y1 = p.y + sy*p.h/2; x2 = n.x; y2 = n.y - sy*n.h/2;
  }else{
    const sx = dx>=0 ? 1 : -1; sx0 = sx;
    x1 = p.x + sx*p.w/2; y1 = p.y; x2 = n.x - sx*n.w/2; y2 = n.y;
  }
  const dim = focusSet && !(focusSet.has(n.id) && focusSet.has(p.id));
  const dpt = n._depth||1;
  const lwm = n.lw==='thin' ? .55 : n.lw==='thick' ? 1.7 : 1;
  const sw = (dpt<=1 ? 5 : dpt===2 ? 3.2 : 2.4) * lwm;
  // 방향 표시: 부모 쪽 작은 점(●) + 자식 쪽 작은 화살촉(▸). 선은 점 중심에서 시작해 화살촉 밑변에서 끝나서 삐져나오지 않는다.
  const len = Math.hypot(x2 - x1, y2 - y1);
  const fwd = (x2 - x1) * sx0 + (y2 - y1) * sy0;           // 선이 실제로 부모→자식 방향으로 나 있나
  const mk = S().edgeMarks !== false && fwd > 0 && len > 12;
  const dot = mk && len > 28;
  const sc = Math.min(sw, 8.5);
  const r = Math.max(2.8, sc * .5 + 1.8), al = 5.5 + Math.min(sc, 5) * .5, aw = Math.max(2.4 + Math.min(sc, 5) * .5, sc * .5 + 1.8);
  const ps = dot ? r : 0;                    // 점 중심이 테두리에 닿도록
  const pe = mk ? 1.2 + al : 0;              // 화살촉 밑변까지
  const xs = x1 + sx0*ps, ys = y1 + sy0*ps, xe = x2 - sx0*pe, ye = y2 - sy0*pe;
  let d;
  if(style === 'd') d = `M${xs.toFixed(1)},${ys.toFixed(1)} L${xe.toFixed(1)},${ye.toFixed(1)}`;
  else if(style === 'v'){ const my = (ys+ye)/2; d = `M${xs},${ys} C${xs},${my} ${xe},${my} ${xe},${ye}`; }
  else{ const mx = (xs+xe)/2; d = `M${xs},${ys} C${mx},${ys} ${mx},${ye} ${xe},${ye}`; }
  let s = `<g opacity="${dim?0.15:(dpt<=1?0.9:0.55)}"><path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="${mk ? 'butt' : 'round'}"${n.ldash?' stroke-dasharray="8 7"':''}/>`;
  if(dot) s += `<circle cx="${(x1 + sx0*r).toFixed(1)}" cy="${(y1 + sy0*r).toFixed(1)}" r="${r.toFixed(1)}" fill="${col}"/>`;
  if(mk){
    const tx = x2 - sx0 * 1.2, ty = y2 - sy0 * 1.2, bx = tx - sx0 * al, by = ty - sy0 * al;
    s += `<path d="M${tx.toFixed(1)},${ty.toFixed(1)} L${(bx - sy0*aw).toFixed(1)},${(by + sx0*aw).toFixed(1)} L${(bx + sy0*aw).toFixed(1)},${(by - sx0*aw).toFixed(1)} Z" fill="${col}"/>`;
  }
  if(n.label){
    const mx = (x1+x2)/2, my = (y1+y2)/2;
    const tw = textW(n.label, 11, true) + 14;
    const lc = isYN ? col : (dark ? '#c9d1e6' : '#4a5568');
    s += `<g data-elabel="${n.id}" transform="translate(${mx},${my})"><rect x="${-tw/2}" y="-9" width="${tw}" height="18" rx="9" fill="${dark?'#171b27':'#ffffff'}" stroke="${col}" stroke-width="1.5"/>`+
         `<text font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="${lc}" font-family='${FONT}'>${esc(n.label)}</text></g>`;
  }
  return s + '</g>';
}

function nodeSvg(n, dark, focusSet, opt){
  const cc = nodeColors(n, dark);
  const selected = !opt.exporting && sel === n.id;
  const dim = focusSet && !focusSet.has(n.id);
  const acc = dark ? '#ff8a65' : '#ef5b36';
  let s = `<g data-nid="${n.id}" transform="translate(${n.x},${n.y})" opacity="${dim?0.18:(cutSetNow && cutSetNow.has(n.id) ? 0.38 : (n.tag==='done' ? 0.62 : 1))}" style="cursor:pointer">`;
  if(!opt.exporting && dropId===n.id) s += shapeSvg(n.shape, n.w+18, n.h+18, 'rgba(34,197,94,.14)', '#22c55e', 3, true);
  if(selected) s += `<g opacity=".3">${shapeSvg(n.shape, n.w+12, n.h+12, 'none', acc, 6, false)}</g>`;
  if(!opt.exporting && mode){
    if(mode.type==='group' && mode.set.has(n.id)) s += `<g opacity=".55">${shapeSvg(n.shape, n.w+14, n.h+14, 'rgba(34,197,94,.15)', '#22c55e', 4, false)}</g>`;
    if(mode.type==='link' && mode.from===n.id) s += `<g opacity=".6">${shapeSvg(n.shape, n.w+14, n.h+14, 'rgba(139,92,246,.15)', '#8b5cf6', 4, true)}</g>`;
  }
  s += `<g filter="url(#sh)">${shapeSvg(n.shape, n.w, n.h, cc.fill, selected ? acc : cc.stroke, selected ? 2.6 : 1.3, n.dashed)}</g>`;
  const lines = n._lines || [''], lh = n._lh || 18, y0 = -(lines.length-1)*lh/2;
  const empty = !n.text;
  s += `<text font-size="${n._fs||14}" font-weight="${n._bold?600:500}" fill="${cc.text}" fill-opacity="${empty?0.45:1}"${n.tag==='done'?' text-decoration="line-through"':''} text-anchor="middle" dominant-baseline="central" font-family='${FONT}' style="pointer-events:none">`;
  if(empty) s += `<tspan x="0" y="0">내용</tspan>`;
  else lines.forEach((l,i) => { s += `<tspan x="0" y="${y0+i*lh}">${esc(l)}</tspan>`; });
  s += `</text>`;
  s += chipsSvg(n, dark);
  s += tagSvg(n, dark);
  if(n.children.length && n.collapsed){
    const nodes = N(), c0 = nodes[n.children[0]];
    let bx, by;
    if(c0 && Math.abs(c0.y-n.y) > Math.abs(c0.x-n.x) && c0.y > n.y){ bx = 0; by = n.h/2 + 12; }
    else{ const dir = c0 && c0.x < n.x ? -1 : 1; bx = dir*(n.w/2 + 12); by = 0; }
    const cnt = desc(n.id).length;
    s += `<g data-toggle="${n.id}" transform="translate(${bx},${by})"><circle r="11" fill="${dark?'#171b27':'#ffffff'}" stroke="${cc.base}" stroke-width="2"/>`+
         `<text font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="${dark?'#e9ecf5':'#172033'}" font-family='${FONT}' style="pointer-events:none">${cnt}</text></g>`;
  }
  return s + '</g>';
}

function buildWorld(opt){
  opt = opt||{};
  const nodes = N(), vis = visibleList();
  const dark = opt.dark!=null ? opt.dark : isDark();
  const focusSet = (!opt.exporting && focusId && nodes[focusId] && S().dim) ? new Set([focusId, ...desc(focusId)]) : null;
  const m = cur(), visSet = new Set(vis.map(n => n.id));
  linkMid.clear();
  cutSetNow = (cutPending && cutPending.mapId===cur().id && nodes[cutPending.id]) ? new Set([cutPending.id, ...desc(cutPending.id)]) : null;
  progNow = computeProg(cur());
  aggNow = computeAgg(cur());
  let s = groupsSvg(m, visSet, dark, opt);
  for(const n of vis){ if(n.parent && nodes[n.parent]) s += edgeSvg(nodes[n.parent], n, dark, focusSet, opt); }
  const LK = linksSvg(m, visSet, vis, dark, focusSet, opt); s += LK.s;
  for(const n of vis) s += nodeSvg(n, dark, focusSet, opt);
  return s + LK.handles;
}

let rafPending = false;
function render(){
  const m = cur(); if(!m) return;
  if(sel) selLink = null;
  if(selLink && !m.links[selLink]) selLink = null;
  world.innerHTML = buildWorld({});
  $('#mapNameText').textContent = m.name;
  $('#hint').textContent = (Object.keys(m.nodes).length<=1) ? '노드를 탭해 선택하고, 아래쪽 + 버튼으로 하위 노드를 추가해 보세요.' : '';
  updateUI();
  if(pn){
    const nn = m.nodes[pn.id];
    if(!nn) closePanel();
    else if(sel && sel!==pn.id && m.nodes[sel]){ flushSheet(); liveEnd(); pn.id = sel; buildPanel(); }
    else setNpTitle();
  }
  placeCtl();
}
function renderSoon(){ if(rafPending) return; rafPending = true; requestAnimationFrame(()=>{ rafPending=false; render(); }); }

function applyView(){
  world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
  $('#zlabel').textContent = Math.round(view.k/BASE_K*100)+'%';
  const st = $('#stage'), gs = Math.max(12, 22*view.k);
  st.style.backgroundSize = gs+'px '+gs+'px'; st.style.backgroundPosition = view.x+'px '+view.y+'px';
  placeCtl();
  saveViewSoon();
}
let viewTimer = null;
function saveViewSoon(){
  clearTimeout(viewTimer);
  viewTimer = setTimeout(()=>{ try{ localStorage.setItem('mm_view2_'+data.current, JSON.stringify(view)); }catch(e){} }, 400);
}
function loadView(){
  let v = null;
  try{ v = JSON.parse(localStorage.getItem('mm_view2_'+data.current)); }catch(e){}
  if(v && isFinite(v.x) && isFinite(v.y) && isFinite(v.k)){ view = { x:v.x, y:v.y, k:clamp(v.k,.1,3) }; applyView(); }
  else{ fitTo(bboxOf(visibleList()), { animate:false }); }
}

let quickTreeScope = false;
const quickBarOn = () => S().quickbar==null ? false : !!S().quickbar;
function renderQuickStyle(){
  const bar = $('#quickStyle');
  const n = sel && N()[sel];
  if(!n || !quickBarOn() || $('#pageMap').classList.contains('hidden')){ bar.classList.add('hidden'); bar.innerHTML=''; return; }
  bar.classList.remove('hidden'); bar.innerHTML='';
  bar.append(h('span',{class:'qs-title'},'빠른 서식'));
  SHAPES.forEach(([id,label])=>{
    const dark = isDark();
    const preview = `<svg width="34" height="24" viewBox="-30 -18 60 36" aria-hidden="true">${shapeSvg(id,46,26,dark?'#303955':'#e8eeff','#6878ff',1.8,false)}</svg>`;
    const b=h('button',{class:'qs-shape'+(n.shape===id?' on':''),type:'button',title:label,'aria-label':label,onclick:()=>{ if(sel) changeShape(sel,id); }},h('span',{html:preview}));
    b.style.minWidth='42px'; b.style.padding='2px 4px'; bar.append(b);
  });
  bar.append(h('span',{class:'qs-sep'}),h('span',{class:'qs-title'},'색상'));
  PALETTE.forEach(c=>bar.append(h('button',{class:'qs-color'+(n.color===c?' on':''),type:'button',style:'background:'+c,title:c,'aria-label':'색상 '+c,onclick:()=>{ if(sel) setColor(sel,c,quickTreeScope?'tree':'self'); }})));
  const lab=h('label',{class:'qs-tree',title:'켜면 선택한 노드와 하위 노드에 색상을 적용합니다.'});
  const chk=h('input',{type:'checkbox',checked:quickTreeScope,onchange:e=>{quickTreeScope=e.target.checked;}});
  lab.append(chk,h('span',{},'하위 포함')); bar.append(lab);
}
let nodeStyleOpen = false;
function renderNodeStylePop(){}
function updateUI(){
  const m = cur(); const hs = histOf(m.id);
  $('#undo').disabled = !hs.u.length; $('#redo').disabled = !hs.r.length;
  const tb = $('#toolbar');
  tb.classList.toggle('nosel', !sel);
  tb.querySelectorAll('button').forEach(b => {
    const a = b.dataset.act;
    b.disabled = (a==='edit'||a==='detail'||a==='link') ? !sel : (a==='sibling') ? (!sel || sel===m.rootId) : (a==='del') ? (!sel || sel===m.rootId) : false;
  });
  renderQuickStyle();
  renderNodeStylePop();
  updateLockUI();
}

/* ===================== 되돌리기 ===================== */
const hist = {};
const histOf = id => hist[id] || (hist[id] = { u:[], r:[] });
const snap = m => JSON.stringify({ rootId:m.rootId, nodes:m.nodes, groups:m.groups, links:m.links }, jsonRep);
function pushUndo(before){ const hs = histOf(cur().id); hs.u.push(before); if(hs.u.length>80) hs.u.shift(); hs.r = []; }
function restore(str){
  const m = cur(), o = JSON.parse(str);
  m.rootId = o.rootId; m.nodes = o.nodes; m.groups = o.groups||{}; m.links = o.links||{}; syncEvents(m); refitAll(m);
  if(sel && !m.nodes[sel]) sel = null;
  if(focusId && !m.nodes[focusId]) focusId = null;
  if(selLink && !m.links[selLink]) selLink = null;
  if(pn){ if(!m.nodes[pn.id]) closePanel(); else buildPanel(); }
}
function undo(){ liveEnd(); const hs = histOf(cur().id); if(!hs.u.length) return; hs.r.push(snap(cur())); restore(hs.u.pop()); saveSoon(); render(); }
function redo(){ liveEnd(); const hs = histOf(cur().id); if(!hs.r.length) return; hs.u.push(snap(cur())); restore(hs.r.pop()); saveSoon(); render(); }
function mutate(fn, opts){
  if(S().lock && !(opts && opts.force)){ lockedMsg(); return; }
  liveEnd();
  const m = cur(), before = snap(m);
  fn(m); cleanup(m); syncEvents(m); refitAll(m);
  if(!(opts && opts.noUndo)) pushUndo(before);
  saveSoon(); render();
}

/* ===================== 시트(팝업) ===================== */
const sheetWrap = $('#sheetWrap'), sheetBody = $('#sheetBody'), sheetTitle = $('#sheetTitle');
let sheetCancel = null;
function openSheet(title, build, onCancel){
  closeSheet(true);
  sheetTitle.textContent = title; sheetBody.innerHTML = '';
  if(!sheetWrap.classList.contains('hidden')) sheetBody.scrollTop=0;
  build(sheetBody);
  sheetCancel = onCancel || null;
  // 손잡이는 시트당 하나만 (이전에는 sheetBody에서 찾아 매번 추가되어 햄버거 메뉴처럼 쌓였음)
  const sheetEl = $('#sheet');
  sheetEl.style.removeProperty('--sheet-height');
  sheetEl.querySelectorAll('.sheet-grip').forEach((g,i)=>{ if(i>0) g.remove(); });
  let grip = sheetEl.querySelector('.sheet-grip');
  if(!grip){
    grip = h('div',{class:'sheet-grip','aria-label':'창 높이 조절: 위로 끌면 확대, 아래로 끌면 축소','title':'위아래로 끌어 높이 조절'});
    sheetEl.insertBefore(grip, sheetTitle);
    let sy=0, sh=0;
    grip.addEventListener('pointerdown',e=>{sy=e.clientY;sh=sheetEl.getBoundingClientRect().height;grip.setPointerCapture(e.pointerId);e.preventDefault();});
    grip.addEventListener('pointermove',e=>{if(!grip.hasPointerCapture(e.pointerId))return;const nh=clamp(sh+(sy-e.clientY),window.innerHeight*.30,window.innerHeight*.96);sheetEl.style.setProperty('--sheet-height',nh+'px');});
    grip.addEventListener('pointerup',e=>{try{grip.releasePointerCapture(e.pointerId)}catch(_){}});
  }
  sheetWrap.classList.remove('hidden');
  fitSheetToViewport();
  placeCtl();
}
function closeSheet(byAction){
  if(sheetWrap.classList.contains('hidden')) return;
  stopMic();
  sheetWrap.classList.add('hidden');
  const cb = sheetCancel; sheetCancel = null; sheetBody.innerHTML = '';
  placeCtl();
  if(!byAction && cb) cb();
}
// 모바일 키보드가 올라오면 편집창을 키보드 위로 올리고 사용 가능한 높이에 맞춘다.
function fitSheetToViewport(){
  if(sheetWrap.classList.contains('hidden')) return;
  const sheet = $('#sheet'), vv = window.visualViewport;
  const height = vv ? vv.height : window.innerHeight, top = vv ? Math.max(0, vv.offsetTop) : 0;
  // 가상 키보드가 실제로 화면을 줄였을 때만(모바일) 시트를 키보드 위로 올린다. PC에서는 포커스만으로 모양이 바뀌지 않는다.
  const kb = isMobile() && height < window.innerHeight - 120;
  if(kb){
    sheet.style.setProperty('--sheet-max-height', Math.max(180, height-12)+'px');
    sheet.style.borderRadius = '18px 18px 0 0';
    sheetWrap.style.alignItems = 'flex-start';
    sheetWrap.style.paddingTop = top+'px';
  }else{
    sheet.style.removeProperty('--sheet-max-height');
    sheet.style.borderRadius = '';
    sheetWrap.style.alignItems = '';
    sheetWrap.style.paddingTop = '';
  }
  sheetWrap.style.paddingBottom = '';
}
if(window.visualViewport){visualViewport.addEventListener('resize',fitSheetToViewport);visualViewport.addEventListener('scroll',fitSheetToViewport);}
window.addEventListener('resize',fitSheetToViewport);
sheetBody.addEventListener('focusin',e=>{setTimeout(()=>{fitSheetToViewport();try{e.target.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});}catch(_){}},250);});
sheetBody.addEventListener('focusout',()=>setTimeout(fitSheetToViewport,350));
$('#sheetBackdrop').addEventListener('click', () => closeSheet());

/* 노드 상세 패널: 모바일 키보드가 올라오면 패널을 보이는 영역(visualViewport)에 맞춰 키우고, 입력칸이 가려지지 않게 한다 */
function fitNpanelToViewport(){
  if(!npanel || npanel.classList.contains('hidden')){
    if(npanel){
      npanel.classList.remove('kb-open','kb-table');
      npanel.style.removeProperty('top'); npanel.style.removeProperty('height');
      npanel.style.removeProperty('max-height'); npanel.style.removeProperty('bottom');
    }
    return;
  }
  if(!isMobile() || fine()){
    npanel.classList.remove('kb-open','kb-table');
    npanel.style.removeProperty('top'); npanel.style.removeProperty('height');
    npanel.style.removeProperty('max-height'); npanel.style.removeProperty('bottom');
    return;
  }
  const vv = window.visualViewport;
  const vh = vv ? vv.height : window.innerHeight;
  const top = vv ? Math.max(0, vv.offsetTop) : 0;
  const focused = document.activeElement;
  const inPanel = !!(focused && npanel.contains(focused) && (
    focused.matches('input,textarea,select,[contenteditable=true]') || focused.closest('.tblwrap,.sh-bar,.addbar')
  ));
  const kbVisible = vh < window.innerHeight - 80;
  const keyboardLikely = kbVisible || inPanel;
  const isTable = !!(pn && pn.tab==='table');
  const tblNoKb = isTable && !(focused && focused.closest && focused.closest('.sh-bar'));   // 표: 수식줄에 입력할 때만 도구·탭을 숨긴다 (우클릭·칸 선택으로는 숨기지 않음)
  if(keyboardLikely && inPanel && !tblNoKb){
    npanel.classList.add('kb-open');
    npanel.classList.toggle('kb-table', isTable);
    // 키보드 위 보이는 영역만 사용 (수식줄이 가려지지 않게)
    const h = Math.max(200, Math.floor(vh - 4));
    npanel.style.top = top + 'px';
    npanel.style.bottom = 'auto';
    npanel.style.height = h + 'px';
    npanel.style.maxHeight = h + 'px';
    const body = $('#npBody');
    if(body){
      // 표: 수식줄을 맨 위로 — 키보드 바로 위에 입력창
      if(isTable){
        body.scrollTop = 0;
        const fx = body.querySelector('.sh-bar');
        if(fx){
          setTimeout(() => {
            try{
              fx.scrollIntoView({ block:'start', inline:'nearest', behavior:'auto' });
              body.scrollTop = 0;
            }catch(_){}
          }, 50);
        }
      }else if(focused){
        setTimeout(() => {
          try{ focused.scrollIntoView({ block:'nearest', inline:'nearest', behavior:'smooth' }); }catch(_){} setTimeout(() => { npanel.scrollTop = 0; }, 450);
        }, 80);
      }
    }
  }else{
    npanel.classList.remove('kb-open','kb-table');
    npanel.style.removeProperty('top');
    npanel.style.removeProperty('height');
    npanel.style.removeProperty('max-height');
    npanel.style.removeProperty('bottom');
  }
}
if(window.visualViewport){
  visualViewport.addEventListener('resize', fitNpanelToViewport);
  visualViewport.addEventListener('scroll', fitNpanelToViewport);
}
window.addEventListener('resize', fitNpanelToViewport);
// 패널 내부 입력 포커스 시 즉시 맞춤
document.addEventListener('focusin', e => {
  if(npanel && !npanel.classList.contains('hidden') && npanel.contains(e.target)){
    setTimeout(fitNpanelToViewport, 50);
    setTimeout(fitNpanelToViewport, 280);
  }
});

function micBtn(ta){
  if(!SR) return null;
  const b = h('button',{ class:'micbtn', type:'button', title:'음성으로 입력', 'aria-label':'음성으로 입력', html:ic('mic',20) });
  b.addEventListener('mousedown', e => e.preventDefault());
  b.addEventListener('click', () => {
    if(recog && recogBtn===b){ stopMic(); return; }
    stopMic();
    let r;
    try{ r = new SR(); }catch(e){ toast('이 브라우저는 음성 입력을 지원하지 않아요'); return; }
    r.lang = 'ko-KR'; r.interimResults = true; r.continuous = false;
    const io = ta._mic; const base = io ? io.start() : ta.value + ((ta.value && !/\s$/.test(ta.value)) ? ' ' : '');
    r.onresult = e => {
      let t = ''; for(let i=0;i<e.results.length;i++) t += e.results[i][0].transcript;
      if(io) io.put(t); else { ta.value = base + t; ta.dispatchEvent(new Event('input',{ bubbles:true })); }
    };
    r.onerror = e => {
      const m = { 'not-allowed':'마이크 권한을 허용해 주세요', 'service-not-allowed':'마이크 권한을 허용해 주세요', 'no-speech':'음성이 들리지 않았어요', 'network':'음성 인식에는 인터넷 연결이 필요해요', 'audio-capture':'마이크를 찾지 못했어요' }[e.error];
      if(m) toast(m);
    };
    r.onend = () => { if(io) io.end(); b.classList.remove('on'); if(recog===r){ recog = null; recogBtn = null; } try{ b.dispatchEvent(new Event('micend')); }catch(_){} };
    recog = r; recogBtn = b; b.classList.add('on');
    try{ r.start(); toast('듣고 있어요… 말씀하세요'); }catch(e){ b.classList.remove('on'); recog = null; recogBtn = null; }
  });
  return b;
}
function askText(o){
  openSheet(o.title, body => {
    const inp = o.multiline ? h('textarea',{rows:3,enterkeyhint:'done',placeholder:o.placeholder||''}) : h('input',{type:'text',placeholder:o.placeholder||''});
    inp.className = 'field'; inp.value = o.value||'';
    let done = false, shiftDown = false;
    const ok = () => { if(done) return; done = true; const v = inp.value; closeSheet(true); o.onOk(v); };
    o._ok = ok;
    inp.addEventListener('keydown', e => {
      shiftDown = e.shiftKey;
      if(e.isComposing || e.keyCode===229) return;
      if(e.key==='Enter' && (!o.multiline || !e.shiftKey)){ e.preventDefault(); ok(); }
    });
    inp.addEventListener('keyup', e => { shiftDown = e.shiftKey; });
    if(o.multiline) inp.addEventListener('beforeinput', e => {
      if((e.inputType==='insertLineBreak' || e.inputType==='insertParagraph') && !shiftDown){ e.preventDefault(); setTimeout(ok, 0); }
    });
    const nl = o.multiline ? h('button',{class:'btn',title:'줄바꿈',onmousedown:e=>e.preventDefault(),onclick:()=>{ inp.setRangeText('\n',inp.selectionStart,inp.selectionEnd,'end'); inp.focus(); }},'줄바꿈') : null;
    const mic = micBtn(inp);
    const left = h('div',{style:'margin-right:auto;display:flex;gap:8px;align-items:center'}, mic, nl);
    body.append(inp, o.multiline ? h('div',{class:'note',style:'margin:8px 0 0'},'Enter = 완료 · Shift+Enter = 줄바꿈'+(mic?' · 🎤 = 음성 입력':'')) : null,

    setTimeout(()=>{ inp.focus(); inp.select(); }, 40);
  }, o.onCancel);
}

function placeNew(p, c){
  const nodes = N(), gp = GAPS[S().gap];
  fitNode(c);
  const kids = p.children.map(i => nodes[i]);
  if(isVertical(p)){
    const last = kids[kids.length-1];
    if(last){ c.x = last.x + last.w/2 + gp.cross*1.6 + c.w/2; c.y = last.y; }
    else{ c.x = p.x; c.y = p.y + p.h/2 + gp.main*0.8 + c.h/2; }
    return;
  }
  let dir = dirOf(p);
  if(p.id===cur().rootId) dir = (kids.length%2===0) ? 1 : -1;
  const same = kids.filter(k => ((k.x-p.x)>=0?1:-1)===dir);
  const last = same[same.length-1];
  if(last){
    c.x = dir>0 ? last.x - last.w/2 + c.w/2 : last.x + last.w/2 - c.w/2;
    c.y = last.y + last.h/2 + gp.cross + c.h/2;
  }else{
    c.x = p.x + dir*(p.w/2 + gp.main + c.w/2); c.y = p.y;
  }
}
function ensureYesNo(d){
  const nodes = N(), gp = GAPS[S().gap];
  if(d.children.some(i => nodes[i].kind==='yes' || nodes[i].kind==='no')) return;
  const dir = dirOf(d);
  [['예','YES','yes',-1],['아니오','NO','no',1]].forEach(([t,lab,kind,sg]) => {
    const c = mkNode({ parent:d.id, text:t, label:lab, kind });
    fitNode(c);
    c.x = d.x + dir*(d.w/2 + gp.main + c.w/2); c.y = d.y + sg*(c.h/2 + 14);
    nodes[c.id] = c; d.children.push(c.id);
  });
  d.collapsed = false;
}
function addChild(pid, o){
  o = o||{};
  if(lockedMsg()) return null;
  const nodes = N(); if(!nodes[pid]) return null;
  let newId;
  mutate(m => {
    const p = m.nodes[pid];
    const c = mkNode({ parent:pid, shape:o.shape||'rounded' });
    p.collapsed = false;
    placeNew(p, c);
    m.nodes[c.id] = c; p.children.push(c.id);
    if(c.shape==='diamond') ensureYesNo(c);
    newId = c.id;
    if(S().auto) tidyMap(m);
  });
  sel = newId; render();
  ensureVisible(newId);
  if(!o.quiet) openEdit(newId, { isNew:true });
  return newId;
}
function addSibling(){
  const m = cur(); if(!sel) return addChild(m.rootId);
  const n = m.nodes[sel]; if(!n.parent) return addChild(sel);
  addChild(n.parent);
}

function startInline(id, o){

function inlVisBottom(){
  const stage = $('#stage'), vv = window.visualViewport, r = stage.getBoundingClientRect();
  return vv ? Math.min(stage.clientHeight, vv.offsetTop + vv.height - r.top - 6) : stage.clientHeight - 6;
}
function placeInline(){
  if(!inl) return;
  const n = N()[inl.id]; if(!n){ inl.ta.remove(); inl = null; return; }
  const ta = inl.ta, k = view.k, stage = $('#stage');
  const sw = stage.clientWidth || 600;
  if(isMobile()){
    // 모바일: 키보드 바로 위에 큰 입력창을 고정 (노드가 가려져도 항상 보임)
    ta.classList.add('dock');
    ta.style.fontSize = '16px'; ta.style.lineHeight = '22px';
    ta.style.width = (sw - 16)+'px'; ta.style.height = 'auto';
    const H = Math.min(Math.max(ta.scrollHeight, 44), 22*5 + 18);
    ta.style.height = H+'px'; ta.style.overflowY = ta.scrollHeight > H ? 'auto' : 'hidden';
    ta.style.left = '8px'; ta.style.top = Math.round(inlVisBottom() - H)+'px';
    return;
  }
  ta.classList.remove('dock'); ta.style.overflowY = 'hidden';
  const fs = Math.max(11, (n._fs || 14) * k), lh = Math.round((n._lh || 18) * k);
  const lines = String(ta.value || ' ').split('\n');
  let w = 0; lines.forEach(l => { w = Math.max(w, textW(l || ' ', n._fs || 14, !!n._bold)); });
  const W = Math.round(clamp((w + 44) * k, Math.max(110, 70*k), Math.min(sw - 16, 380*Math.max(k,.9))));
  ta.style.fontSize = fs+'px'; ta.style.lineHeight = lh+'px'; ta.style.width = W+'px';
  ta.style.height = 'auto';
  const H = Math.max(ta.scrollHeight, lh + 14);
  ta.style.height = H+'px';
  const cx = n.x*k + view.x, cy = n.y*k + view.y;
  const L = clamp(cx - W/2, 6, Math.max(6, sw - W - 6));
  ta.style.left = Math.round(L)+'px'; ta.style.top = Math.round(cy - H/2)+'px';
  placeInlBar();
}
function keepInlineVisible(){
  if(!inl) return;
  const n = N()[inl.id]; if(!n) return;
  if(isMobile()){
    placeInline(); placeInlBar();
    const bar = $('#inlBar');
    const topLimit = (bar && !bar.classList.contains('hidden') ? bar.offsetTop : inl.ta.offsetTop) - 14;
    const cy = n.y*view.k + view.y, half = ((n.h||36)/2 + 8)*view.k;
    if(cy + half > topLimit){ view.y -= (cy + half - topLimit); applyView(); }
    else if(cy - half < 8){ view.y += (8 - (cy - half)); applyView(); }
    placeInline(); placeInlBar();
    return;
  }
  const vv = window.visualViewport; if(!vv) return;
  const r = inl.ta.getBoundingClientRect();
  const bottomLimit = vv.offsetTop + vv.height - 16;
  if(r.bottom > bottomLimit){ view.y -= (r.bottom - bottomLimit) + 24; applyView(); }
  else if(r.top < vv.offsetTop + 60){ view.y += (vv.offsetTop + 80 - r.top); applyView(); }
}

  stopMic(); inl = null; ta.remove(); placeInlBar();

    mutate(m => { m.nodes[id].text = v; if(isNew && S().auto) tidyMap(m); }, isNew ? { noUndo:true } : null);
  }else render();

}
