name: APK 만들기

# GitHub 저장소 > Actions > "APK 만들기" > Run workflow 를 누르면
# 저장소의 index.html 로 APK 를 만들어 Releases 에 올려요.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 앱 프로젝트 만들기
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          mkdir www
          cp ../index.html www/index.html
          for f in manifest.json sw.js icon-192.png icon-512.png; do [ -f ../$f ] && cp ../$f www/$f || true; done
          echo '{ "appId":"com.mindmap.app", "appName":"마인드맵", "webDir":"www" }' > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: 버전 번호 적용
        run: |
          cd app/android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          grep -n "versionCode\|versionName" app/build.gradle

      - name: 아이콘 적용 (실패해도 계속)
        continue-on-error: true
        run: |
          [ -f icon-512.png ] || { echo "icon-512.png 없음 - 기본 아이콘 사용"; exit 0; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          IM=$(command -v magick || command -v convert)
          echo "ImageMagick: $IM"
          RES=app/android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round; do
              $IM icon-512.png -resize ${s}x${s} $RES/mipmap-$n/$f.png
            done
          done

      - name: 서명 키 넣기 (매번 같은 키 → 덮어서 업데이트 가능)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore

      - name: APK 빌드
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../mindmap.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 마인드맵 APK ${{ github.run_number }}
          body: "이 파일(mindmap.apk)을 받아 설치하세요. 기존 앱 위에 덮어서 설치하면 데이터는 유지돼요."
          files: mindmap.apk
          make_latest: true
